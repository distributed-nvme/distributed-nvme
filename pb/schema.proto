syntax = "proto3";

option go_package = "github.com/distributed-nvme/distributed-nvme/pb";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message AgentReply {
    uint32 code = 1;
    string details = 2;
}

// ObsStamp says which observation an agent's reply answers from
// (architecture.md, Live-state reporting). Every time is by the node's
// clock, so a difference of two of them never holds a clock difference
// between machines.
message ObsStamp {
    // When the reading of the observation ended. Unset: the agent holds no
    // observation of the object yet.
    google.protobuf.Timestamp obs_time = 1;
    // The trace id of the call whose converge or read made the observation.
    string obs_trace_id = 2;
    // The agent's clock when it answered.
    google.protobuf.Timestamp answer_time = 3;
    // When the converge of the object that runs now began. Unset: none runs.
    google.protobuf.Timestamp converge_start = 4;
    // When the agent process began to serve, the start of its startup pass
    // (dnagent.md SH33): the worker measures a start series' hold from it,
    // and logs a new value on a round's reply as the agent's restart
    // (dnv-worker.md HL8).
    // Appended, never renumbered.
    google.protobuf.Timestamp agent_start_time = 5;
}

// BlockStat is one block device's counters as the kernel's sysfs "stat"
// file holds them when the agent reads it: its seventeen fields, in the
// kernel's order, each the raw running count since the device appeared
// (requests, merges, 512-byte sectors and milliseconds), never a rate. A
// person compares two reads to see a device's load; nothing in dnv reads them
// (cnagent.md CN23; dnagent.md DN16).
message BlockStat {
    uint64 read_ios = 1;
    uint64 read_merges = 2;
    uint64 read_sectors = 3;
    uint64 read_ticks_ms = 4;
    uint64 write_ios = 5;
    uint64 write_merges = 6;
    uint64 write_sectors = 7;
    uint64 write_ticks_ms = 8;
    uint64 in_flight = 9;
    uint64 io_ticks_ms = 10;
    uint64 time_in_queue_ms = 11;
    uint64 discard_ios = 12;
    uint64 discard_merges = 13;
    uint64 discard_sectors = 14;
    uint64 discard_ticks_ms = 15;
    uint64 flush_ios = 16;
    uint64 flush_ticks_ms = 17;
}

// DevIoStats is one device's BlockStat as an inspect call read it, keyed as
// the device's row is, whose name names the device: the counters, or the
// failed read's text in their place (at most IoStatErrorMax bytes, its end
// kept), never zeros.
message DevIoStats {
    oneof read {
        BlockStat stat = 1;
        string read_error = 2;
    }
}

// LegProbeTimes is the last completed round of a primary's leg prober
// (cnagent.md CN11), kept in memory only, in whole milliseconds; an age is
// counted back from the reply's answer time and stops at the largest
// uint32.
message LegProbeTimes {
    // How long before the answer the round began.
    uint32 round_age_ms = 1;
    // How long its write half took: a buffered write and an fsync.
    uint32 write_ms = 2;
    // How long its direct read half took. Unset when the write failed and
    // no read ran.
    optional uint32 read_ms = 3;
    // How long before the answer the last round that succeeded ended.
    // Unset: none has.
    optional uint32 last_success_age_ms = 4;
}

// LegIoStats is one leg's part of a cntlr's CntlrIoStats.
message LegIoStats {
    // The leg wrapper's counters.
    DevIoStats dev = 1;
    // Unset on a standby, which runs no prober, and before the first round
    // ends.
    LegProbeTimes probe_times = 2;
}

// CntlrIoStats is what an inspect call of a cntlr reads beside its
// observation (cnagent.md CN23): each leg's and each namespace device's
// counters, read at the call, and each leg's probe times. No check round and
// no syncup reply carries it.
message CntlrIoStats {
    map<uint64, LegIoStats> leg_id_to_io = 1;
    map<uint64, DevIoStats> ns_id_to_io = 2;
}

message NodeSelector {
    repeated string black_list = 1;
    repeated string white_list = 2;
}

message NvmeTrConf {
    string tr_type = 1;
    string adr_fam = 2;
    string tr_addr = 3;
    string tr_svc_id = 4;
}

message QosRatio {
    bool strict = 1;
    uint64 bytes_per_iops = 2;
    uint64 bytes_per_bps = 3;
}

message DmCloneConf {
    uint32 hydration_threshold = 1;
    uint32 hydration_batch_size = 2;
}

message DmPoolConf {
    uint64 data_block_size = 1;
    // Thin pool low water mark.
    // 0 means "unset" and is resolved once, on the
    // create request (architecture.md, Common validation): to the
    // cluster's stored value for a storage pool,
    // else to DefaultPoolLowWatermarkPct. A 0 read
    // back out of etcd is refused as an invalid conf.
    // 1 - 100 means percentage
    // >100 means won't grow a slice automatically.
    uint32 low_water_mark_pct = 2;
}

message RedundNone {}

message RedundMdRaid1 {
    // chunk_size_in_byte = bitmap_chunk_block_cnt * DmPoolConf.data_block_size
    uint64 bitmap_chunk_block_cnt = 1;
}

message RedundConf {
    oneof RedunKind {
        RedundNone redund_none = 1;
        RedundMdRaid1 redund_md_raid1 = 2;
    }
}

// Just a placeholder
message BdevFeatureNone {}

message BdevFeature {
    oneof BdevFeatureKind {
        BdevFeatureNone bdev_feature_none = 1;
    }
}

message DmRaid0Conf {
    uint64 stripe_size = 1;
}

message BdevConf {
    DmPoolConf dm_pool_conf = 1;
    DmRaid0Conf dm_raid0_conf = 2;
    RedundConf redund_conf = 3;
    repeated BdevFeature bdev_feature_list = 4;
}

// For all EventThreshold fields, 0 means using the
// default value.
message EventThreshold {
    // How many seconds to wait before selecting a
    // new prmary.
    uint32 primary_unhealthy = 1;
    // How many seconds to wait before allocating a
    // new cntlr and delete the old one.
    uint32 cntlr_unhealthy = 2;
    // How long the SIDE must have been unhealthy
    // before its leg is repaired; the leg only has
    // to be unhealthy, for any duration
    // (dnv-worker.md AR8 case 2).
    uint32 side_unhealthy = 3;
    // How long the LEG must have been unhealthy
    // before it is repaired (AR8 case 1).
    uint32 leg_unhealthy = 4;
    // The fast IO fail timeout, in seconds, of every
    // leg connection of the pool's cntlrs: how long
    // the kernel holds IO queued for a leg whose
    // controller is reconnecting to a lost disk node
    // before it fails it (dnagent.md SH20). Its range
    // when set is architecture.md, Common validation.
    // Appended, never renumbered.
    uint32 leg_fast_io_fail_tmo = 5;
}

message SidePointer {
    uint64 sp_id = 1;
    uint64 leg_id = 2;
    uint64 side_id = 3;
}

message CntlrPointer {
    uint64 sp_id = 1;
    uint64 cntlr_id = 2;
}

message Side {
    uint64 side_id = 1;
    string addr_port = 2;
    uint32 cntlid_slot = 3;
    NvmeTrConf nvme_tr_conf = 4;
    uint64 err_epoch = 5;
    bool provisioned = 6;
}

message Leg {
    uint64 leg_id = 1;
    uint32 leg_idx = 2;
    repeated Side side_list = 3;
    uint64 err_epoch = 4;
}

message Group {
    uint64 grp_id = 1;
    uint64 ext_cnt = 2;
    uint64 meta_blocks = 3;
    uint64 data_blocks = 4;
    repeated Leg leg_list = 5;
    reserved 6;
    reserved "spare_leg_list";  // retired with its number, never reused: a
                                // list of legs renumbered onto 6 would decode
                                // a stored group's old entries as its own,
                                // silently; the name goes with it.
    // The name of the group's repair, whatever its stage, empty while it
    // has none: one repair per group, checked in the transaction that
    // creates one without
    // a scan, and the link a cntlr finds the group's repair by in its
    // request. CreateRepair sets it, and FinishRepair, CancelRepair and the
    // drains clear it with the Repair key. Appended, never renumbered.
    string rep_name = 7;
    // The leg ids of the group's retired legs, at most MaxRetiredLegPerGrp;
    // a reader that needs the oldest compares retired_epoch. Every
    // transaction that puts or deletes a RetiredLeg key changes this list and
    // SpConf.retired_leg_id_list with it, so an operation reads a group's
    // retired legs without a scan. Appended, never renumbered.
    repeated uint64 retired_leg_id_list = 8;
    // An operator's forced start of the group's array, unset while none
    // stands: ForceStartGroup writes it and withdraws it on a cancel, the sp
    // worker clears it once the primary reports the array running with a
    // member in sync on a leg whose own row reads OK (dnv-worker.md AR13),
    // FinishRepair clears one that names the bad leg it retires, and
    // TryToAbortRepair is refused while one names the repair's new leg. It
    // rides to every cntlr in the group's record (architecture.md, Repair).
    // Appended, never renumbered.
    ForcedStart forced_start = 9;
    // The operator's take-over of the group's repair from the sp worker,
    // false while none stands: UpdateGroupOperatorInCharge sets and clears
    // it, and while it is set the worker creates no repair of the group and
    // CreateRepair refuses a name with the reserved prefix (architecture.md,
    // Repairs). The primary reads it too: while it is set the primary
    // leaves a broken array of the group as it is (cnagent.md CN12, The
    // re-assembly), so its write raises SpRev. A record without it decodes
    // as false. Appended, never renumbered.
    bool operator_in_charge = 10;
    // Set once the group's array has run: the sp worker sets it from a
    // report of the primary whose row of the group reads OK, and nothing
    // clears it (dnv-worker.md AR15). The primary never creates an array
    // for a group that carries it (cnagent.md CN12, case 1): its legs that
    // read no superblock were zeroed by a forced start and hold data. A
    // record without it decodes as false, and the worker sets it at the
    // group's first OK row. Appended, never renumbered.
    bool array_made = 11;
    // The group's md check (dnv-worker.md AR16): written by the sp worker
    // alone. A record without it reads as a group never scheduled.
    // Appended, never renumbered.
    MdCheck md_check = 12;
}

// The schedule of one group's md check (Group.md_check; dnv-worker.md AR16).
message MdCheck {
    // When the group's next check is due, in Unix seconds; zero while the
    // sp worker has not scheduled the group yet.
    uint64 next_epoch = 1;
    // Set while the sp worker asks the primary to run the check, to the
    // time it asked; the primary runs md's check for it and reports it done
    // (CntlrInfo.GrpInfo.md_check_done_epoch; cnagent.md CN12). Zero when
    // no check is asked for.
    uint64 request_epoch = 2;
}

// The mark of a forced start (Group.forced_start): the leg the primary
// starts the group's array from alone, a leg of its leg_list or the new leg
// of its open repair, the SpRev revision the write of the mark committed,
// from which on a report can clear it (dnv-worker.md AR13), and the
// refusals the operator chose to pass.
message ForcedStart {
    uint64 leg_id = 1;
    uint64 revision = 2;
    // The force of a mark an older gateway wrote, which passes every kind of
    // refusal an override names; this build never writes it, and a mark
    // stored with it still passes all three, since marks stay in etcd across
    // a lockstep upgrade (cnagent.md CN12). Appended, never renumbered.
    bool force = 3;
    // The kinds of refusal the start passes (ForceStartGroupRequest.
    // override_list), each named once: OLDER_LEG and BAD_BLOCKS, which the
    // primary meets (cnagent.md CN12), and PARTIAL, which lets the mark name
    // a taken-back leg that carries the partial mark (Repair.
    // new_leg_id_to_partial). Appended, never renumbered.
    repeated ForcedStartOverride override_list = 4;
}

// The kind of a forced-start refusal an operator may choose to pass
// (cnagent.md CN12; architecture.md, Repair, Forced start). Appended, never
// renumbered.
enum ForcedStartOverride {
    // Names no refusal.
    FORCED_START_OVERRIDE_NONE = 0;
    // A full member of the named leg's identity that the start would zero
    // holds a higher md change count, so newer data.
    FORCED_START_OVERRIDE_OLDER_LEG = 1;
    // The named leg carries a bad-block list, which the start drops.
    FORCED_START_OVERRIDE_BAD_BLOCKS = 2;
    // The named leg is a new leg the group's repair took back from a retired
    // leg that carries the partial mark (Repair.new_leg_id_to_partial).
    FORCED_START_OVERRIDE_PARTIAL = 3;
}

// One refusal of a forced start that an override passes, as the dry run
// lists it (ForcedStartDryRun.refusal_list).
message ForcedStartRefusal {
    ForcedStartOverride override = 1;
    // What the refusal says, cut to the row text cap.
    string text = 2;
    // The request's override_list names its kind, so the start goes on over
    // it.
    bool overridden = 3;
}

message Namespace {
    uint64 ns_id = 1;
    uint32 ns_idx = 2;
    uint64 td_id = 3;
    string dev_uuid = 4;
    string dev_nguid = 5;
    bool suspended = 6;
}

enum SpLevel {
    // all dm/md devices are readable/writable
    SP_LEVEL_READWRITE = 0;
    // all user-facing namespaces are readonly:
    // reads are served, writes fail with an IO error.
    // Enforced on the CN only, by a write-failing table on the
    // namespace device — never by a bdev read-only flag, and never
    // on the DN (architecture.md, SpLevel; [D11]).
    SP_LEVEL_READONLY = 16;
    // Do not create all dm-clone for clones
    // and include all in SP_LEVEL_READONLY
    SP_LEVEL_NO_CLONE = 32;
    // Do not create thin pools
    // and include all in SP_LEVEL_NO_CLONE
    SP_LEVEL_NO_THINPOOL = 48;
    // Do not create group devices, md arrays and linears alike, whatever
    // the redundancy, and include all in SP_LEVEL_NO_THINPOOL
    SP_LEVEL_NO_REDUND = 64;
    // Do not create dm-clone for migrations
    // and include all in SP_LEVEL_NO_REDUND
    SP_LEVEL_NO_MIGRATION = 80;
    // Do not export sides
    // and include all in SP_LEVEL_NO_MIGRATION
    SP_LEVEL_NO_SIDE = 96;
    // Only keep the side data devices, their allocation records, their
    // zeroing and a migration destination's clone-metadata record
    SP_LEVEL_DISABLE = 112;
}

enum ResStatus {
    // UNKNOWN means can't get response from dn/cn
    RES_STATUS_UNKNOWN = 0;
    // MISSING means dn/cn has not created it or, on a clone's
    // clone_id_to_target row, that this node reads the clone's source as
    // not connected, not live or with no namespace; the row's reason marks
    // a resource the sp_level suppresses, and a clone row this node keeps
    // missing because it does not read the clone's source as ready
    // (cnagent.md CN18 says which, and when a source still coming up reads
    // so); the worker's settle waits for neither (architecture.md,
    // Live-state reporting)
    RES_STATUS_MISSING = 1;
    // ERROR means dn/cn tried to create it but failed
    RES_STATUS_ERROR = 2;
    // OK means OK
    RES_STATUS_OK = 3;
    // PROVISIONING means deliberately not created / being prepared;
    // healthy; no action needed
    RES_STATUS_PROVISIONING = 4;
    // PENDING means waiting on something else before it can be judged or
    // built: on a cntlr's leg row, the primary's health prober for the leg
    // has not completed a round since it started (at the leg's build, a
    // promotion or an agent restart), or no prober is registered yet
    // (cnagent.md CN11); on a side, the primary's dm-linear, whose path
    // stays closed until every other dm-linear of the side is proven
    // fenced (dnagent.md DN10). It sets no health epoch: on a leg it
    // neither sets nor clears one, and a side whose only row not OK is
    // pending reads as a clean round (dnv-worker.md HL2). The side's
    // verdict names its row, so the worker re-sends the SyncupSide.
    RES_STATUS_PENDING = 5;
}

// Why a row reads as it does, where a control-plane decision needs the cause
// and not only the status: the decision reads this field, never an English
// sentence in details (architecture.md, Live-state reporting). Appended
// values only, never renumbered.
enum ResReason {
    // No reason given: every row but the ones a value below names.
    RES_REASON_NONE = 0;
    // The thin volume build of a created thin device failed because its
    // slice's pool no longer holds the thin id: dm-thin refused the thin
    // table with ENODATA (cnagent.md CN14, CN29). Only a converge's report
    // sets it, on that RES_STATUS_ERROR thin row; a background read's probe
    // never does, so a Check round carries it only while it answers from a
    // converge's observation.
    RES_REASON_THIN_ID_LOST = 1;
    // A migration's dst side waits for the cutover: its request carries
    // MigrDstConf.cutover_pending and its metadata wrapper stands
    // (dnagent.md DN13, DN18). The dn agent sets it on both channels, on
    // the two RES_STATUS_PROVISIONING rows of SideInfo.MigrDstInfo, and the
    // worker's cutover reads it from target_info (dnv-worker.md RW18).
    RES_REASON_AWAITING_CUTOVER = 2;
    // The sp_level suppresses the resource: the cn agent sets it on every
    // RES_STATUS_MISSING row its level suppresses, on both channels, beside
    // the details "sp_level", which are for people (cnagent.md CN19, CN29),
    // and the worker's settle reads such a row as built (dnv-worker.md HL2).
    RES_REASON_SP_LEVEL = 3;
    // This node does not read a clone's source as ready: the cn agent sets
    // it on both channels, from its own reading of the source, on the
    // RES_STATUS_MISSING rows CN18's shared rule gives a clone for that
    // reading — its clone_id_to_target row, and its clone_id_to_dm_clone
    // row that says the source is not connected or unknown while the clone
    // meta group is ready — save the target row's "no namespace" and the
    // dm-clone row's source text in the state CN18 names, where a connect
    // of the converge's own pass leaves the namespace head still to come
    // (cnagent.md CN18, CN29). It names this node's reading, not a fault
    // proven on the source's own node. The rows of a clone the sp_level
    // suppresses carry RES_REASON_SP_LEVEL instead. The worker's settle
    // reads such a row as built (dnv-worker.md HL2).
    RES_REASON_SOURCE_FAULT = 4;
    // The object is there and differs from what the desired state wants
    // in a way a converge rewrites and that leaves no primary without its
    // optimized path: a namespace wanted
    // non-optimized or inaccessible whose ANA group differs, as one still
    // optimized after a failed move to inaccessible (one wanted optimized
    // that is not reads RES_STATUS_ERROR instead), and a thin pool whose
    // metadata total is short of its metadata device, which a reload
    // finishes, or that holds a metadata snapshot no live reader made,
    // which a release ends (cnagent.md CN13), its details the raw status
    // line, which shows the short total or the held root. Both agents set
    // it on both channels, on a RES_STATUS_OK row whose details say what
    // differs, and the object's verdict names the row on both channels, so
    // the worker re-sends its Syncup* (dnagent.md SH31). The worker's
    // health reads the status alone, so the row is healthy.
    RES_REASON_DIFFERS = 5;
    // The ns-dev of an effectively suspended namespace is parked: live, its
    // table a dm-linear over the td's dm-error (cnagent.md CN16). The cn
    // agent sets it on both channels, on that RES_STATUS_OK
    // ns_id_to_dm_linear row beside the details "parked", which are for
    // people, and the gateway's GetThinDeviceBitmap reads it: a volume's
    // bitmap is read only while no namespace on it can take a write
    // (architecture.md, Bitmap reads).
    RES_REASON_PARKED = 6;
    // A slice's thin pool whose metadata carries dm-thin's needs_check
    // flag: the pool is read-only and stays so on every node that opens it,
    // until an operator repairs its metadata. The cn agent sets it on both
    // channels, on that RES_STATUS_ERROR slice_id_to_dm_pool row, its
    // details the raw status line (cnagent.md CN13), and the worker's
    // shared-state class reads it, so no failover or cntlr replacement
    // follows it (dnv-worker.md HL2).
    RES_REASON_POOL_NEEDS_CHECK = 7;
    // A slice's thin pool that dm-thin failed (its status line reads Fail),
    // or whose status read could not read its metadata (Error). The cn agent
    // sets it on both channels, on that RES_STATUS_ERROR slice_id_to_dm_pool
    // row, its details the raw status line (cnagent.md CN13). The failure
    // lives in the loaded pool alone, so it is the cntlr's own fault: a new
    // primary opens the pool from its last commit. The verdict does not
    // name the row, since no converge opens the pool again (CN30).
    RES_REASON_POOL_FAILED = 8;
    // A thin volume not yet created whose thin id the cn agent does not
    // adopt: the thin create failed, whatever the failure, and the slice
    // pool's device headers show the id mapping blocks, or that header read
    // failed other than for a metadata snapshot already held (cnagent.md
    // CN14). The cn agent sets it on a converge's
    // RES_STATUS_ERROR thin row, its details the blocks or the read's
    // failure; a read finds the volume absent. The verdict does not name the
    // row (CN30), and the worker's shared-state class reads it for a td
    // created or not, so no failover follows it (dnv-worker.md HL2).
    RES_REASON_THIN_ID_NOT_ADOPTED = 9;
    // A leg of the group's leg_list that the primary does not add to the
    // group's running array, because its md superblock carries another
    // identity than the array's (cnagent.md CN12). The cn agent sets it on
    // both channels, on the leg's row while that row reads RES_STATUS_OK,
    // its status and details kept; the running array tells which identity
    // is current, and the reason tells the operator why the leg stays out.
    // No health rule reads it, and the verdict does not name the row;
    // CreateRepair reads it to take the leg as a repair's bad leg though it
    // has no health epoch (architecture.md, Repairs).
    RES_REASON_OTHER_IDENTITY = 10;
    // A leg of the group whose md superblock carries one of two identities
    // the legs of its first tier carry while no array of the group runs, so
    // the assembly is refused and the agent cannot decide which identity is
    // current (cnagent.md CN12). The cn agent sets it on the row of every
    // such leg, on a converge whose assembly meets the two and on a read of
    // the absent array, the row's status and details kept; the group's row
    // names both identities. No health rule reads it, and the verdict does
    // not name the row; CreateRepair reads it and takes the leg as a
    // repair's bad leg only with force_undecided, the operator's judgement
    // of which copy is stale (architecture.md, Repairs).
    RES_REASON_IDENTITY_UNDECIDED = 11;
}

message ResInfo {
    string res_name = 1;
    ResStatus status = 2;
    string details = 3;
    uint64 epoch = 4;
    // RES_REASON_NONE on every row but the ones ResReason names. A change of
    // the reason alone does not move epoch, as a change of details alone
    // does not (dnagent.md SH14). Appended, never renumbered.
    ResReason reason = 5;
}

message DnInfo {
    // The disk node's counts of its own volume table (dnagent.md DN18):
    // numbers beside the rows, and no row themselves, so they carry no
    // status and no epoch and neither set nor clear an err_epoch
    // (dnv-worker.md HL1). The agent sends them only beside an OK meta row,
    // from a table it has confirmed as this dn's and a disk size a read has
    // answered; otherwise the field is absent, so an unknown count never
    // reads as zero. The dn role compares free_ext_cnt with the record's
    // DnConf.free_ext_cnt (dnv-worker.md RW13). The names of the two extent
    // counts are DnConf's, so the agent's numbers and the record's print
    // under one key.
    message DiskCounts {
        // The extents of the data area: the disk's size past the fixed
        // prefix, divided by the header's extent_size.
        uint64 total_ext_cnt = 1;
        // The extents of the data area no side record holds.
        uint64 free_ext_cnt = 2;
        // The side records the table holds.
        uint64 side_rec_cnt = 3;
        // The units of the clone-metadata area no record holds.
        uint64 free_meta_units = 4;
        // Whether the side records name exactly the sides of the request's
        // side_pointer_list, matched by sp_id and side_id.
        bool side_recs_match = 5;
    }
    ResInfo disk_info = 1;
    ResInfo meta_info = 2;
    ResInfo port_info = 3;
    // Appended, never renumbered.
    DiskCounts disk_counts = 4;
    // The agent's local store (dnagent.md SH4, DN18): RES_STATUS_ERROR, with
    // the latest refused write's error, from a save the disk refused until a
    // later save or probe holds; RES_STATUS_OK otherwise. Filled on both
    // channels. An agent that predates the row sends none, which the worker
    // reads as no row.
    ResInfo store_info = 6;
    // Retired with its number, never reused: a field renumbered onto it
    // would decode an older agent's row as itself, silently.
    reserved 5;
    reserved "migr_vg_info";
}

message CnInfo {
    ResInfo port_info = 1;
    // Retired with their numbers, never reused: a field renumbered onto one
    // would decode an older agent's row as itself, silently; the names go
    // with them.
    reserved 2, 3, 4;
    reserved "tmpfs_info", "tmp_file_info", "loop_dev_info";
    reserved 5;  // retired, never reused: a field renumbered onto it would decode silently
    // The agent's local store, as DnInfo.store_info says (cnagent.md CN28).
    ResInfo store_info = 6;
}

message SideInfo {
    message MigrSrcInfo {
        ResInfo dm_linear_info = 1;
        ResInfo nvmeof_info = 2;
    }
    message MigrDstInfo {
        ResInfo target_info = 1;
        ResInfo dm_clone_info = 2;
    }
    ResInfo side_dev_info = 1;
    map<uint64, ResInfo> cn_id_to_dm_error = 2;
    map<uint64, ResInfo> cn_id_to_dm_linear = 3;
    map<uint64, ResInfo> cn_id_to_nvmeof = 4;
    MigrSrcInfo migr_src_info = 5;
    MigrDstInfo migr_dst_info = 6;
    reserved 7, 8;  // retired, never reused: a renumbered field decodes silently
    uint64 zeroed_bytes = 9;
    uint64 zero_bytes = 10;  // always filled; equal and above zero => zeroed
}

message CntlrInfo {
    message ThinInfo {
        map<uint64, ResInfo> slice_id_to_dm_thin = 1;
        // The cn agent's torn mark for this thin device (cnagent.md CN14):
        // in one run of the snapshot pre-pass a slice's message made a new
        // thin id while another slice already had its id, or the run's
        // messages made ids in two slices without the origin's quiesce. The
        // agent saves it in its local store at once and keeps it until the
        // request shows the td torn or drops it; every cntlr reports it, in
        // any role, the converge's report and a background read's alike, a
        // standby in an entry with no rows; and the worker records it in
        // ThinDevice.torn from the first report that shows it
        // (dnv-worker.md RW19). Appended, never renumbered.
        bool torn = 2;
    }
    // The primary's verdict on one repair: whether the repair's new leg
    // holds a place in the group's array, copying or in sync, while md holds
    // nothing on the bad leg, and whether the abort of a repair whose flag
    // is set is confirmed, the new leg being no member. Fields, not rows: no
    // health rule reads them.
    message RepairInfo {
        bool started = 1;
        bool abort_confirmed = 2;
        // Why the primary does not add the repair's new leg, taken from a
        // retired leg, empty when nothing holds the add back: its md
        // superblock carries another identity than the member md holds in
        // sync, and the repair carries no force, or the same identity and an
        // events count above that member's, so it holds newer data than the
        // array (cnagent.md CN12). Text for people and for the sp worker's
        // log; no rule reads it. Appended, never renumbered.
        string refusal = 3;
        // The repair's new legs whose members the running array holds, in
        // any state — in sync, copying, a spare or failed — ascending: md
        // has written its superblock onto each, so a taken-back leg is no
        // longer the copy it was. The sp worker marks such a leg partial
        // (dnv-worker.md AR11). Appended, never renumbered.
        repeated uint64 held_new_leg_id_list = 4;
        // Why the primary holds the repair at its stage while the group's
        // array runs, empty when nothing does: a new leg it cannot add yet,
        // no member to feed a copy or to keep the data, a bad leg md still
        // holds in its place while it serves, or a new leg md still holds
        // under an abort (cnagent.md CN12). Text for people and for the sp
        // worker's log (dnv-worker.md AR17); no rule reads it. A take-back's
        // refusal is refusal's, not this. Appended, never renumbered.
        string waits = 5;
    }
    // What the primary reads of one group's running array: whether it is
    // whole, every place holding a member in sync, and the leg ids, of
    // leg_list legs and of repairs' new legs, whose members md holds in sync.
    // Fields, not rows: no health rule reads them.
    message GrpInfo {
        bool whole = 1;
        repeated uint64 in_sync_leg_id_list = 2;
        // Why the primary does not add a leg of the group's leg_list that
        // the array lacks, empty when nothing holds an add back: its md
        // superblock carries another identity than the running array's, so
        // it may hold data the array lacks (cnagent.md CN12). Text for
        // people and for the sp worker's log; no rule reads it. Appended,
        // never renumbered.
        string refusal = 3;
        // The revision of the group's forced-start mark whose forced start
        // this agent process ran its assembly for, the acted mark, while the
        // cntlr's request, counting as delivered, still carries a mark with
        // that revision; zero otherwise. The sp worker clears a mark only once the reading names
        // its revision (cnagent.md CN12, CN28; dnv-worker.md AR13). Kept in
        // memory alone, so an agent restart forgets it. Appended, never
        // renumbered.
        uint64 forced_start_revision = 4;
        // The request_epoch of the group's md check (Group.md_check) whose
        // check this agent process started, or adopted running, and saw
        // end, while the cntlr's request still carries that request; zero
        // otherwise. The sp worker ends the request once a reading names it
        // (cnagent.md CN12; dnv-worker.md AR16). Kept in memory alone, so an
        // agent restart forgets it. Appended, never renumbered.
        uint64 md_check_done_epoch = 5;
        // The bad-block ranges md records on the member of each leg of the
        // group the running array holds (dev-*/bad_blocks, which lists every
        // range, acknowledged or not), for the legs that have one or more
        // (cnagent.md CN12, CN28); the sp worker's leg repair reads it
        // (dnv-worker.md AR8). Appended, never renumbered.
        map<uint64, uint32> leg_id_to_bad_blocks = 6;
        // md's slot of the member of each leg the running array holds in
        // sync (dev-*/slot), keyed by the legs of in_sync_leg_id_list
        // (cnagent.md CN28). The sp worker fences the leg of the lowest slot
        // last in a failover (dnv-worker.md RW24). Appended, never
        // renumbered.
        map<uint64, uint32> in_sync_leg_id_to_slot = 7;
    }
    map<uint64, ResInfo> ss_id_to_subsystem = 1;
    map<uint64, ResInfo> ns_id_to_namespace = 2;
    map<uint64, ResInfo> ns_id_to_dm_linear = 3;
    map<uint64, ResInfo> td_id_to_raid0 = 4;
    map<uint64, ResInfo> td_id_to_dm_error = 5;
    map<uint64, ThinInfo> td_id_to_thin_info = 6;
    map<uint64, ResInfo> slice_id_to_dm_pool = 7;
    map<uint64, ResInfo> slice_id_to_meta = 8;
    map<uint64, ResInfo> slice_id_to_data = 9;
    map<uint64, ResInfo> grp_id_to_md_raid = 10;
    map<uint64, ResInfo> leg_id_to_leg = 11;
    map<uint64, ResInfo> xfer_id_to_dm_linear = 12;
    map<uint64, ResInfo> xfer_id_to_subsystem = 13;
    map<uint64, ResInfo> xfer_id_to_namespace = 14;
    map<uint64, ResInfo> clone_id_to_target = 15;
    map<uint64, ResInfo> clone_id_to_dm_clone = 16;
    reserved 17;
    reserved "clone_id_to_meta";  // retired with its number, never reused:
                                  // a map renumbered onto 17 would decode an
                                  // older agent's rows as its own,
                                  // silently; the name goes with it.
    // One row per side of each leg whose side_list holds two sides, keyed by
    // side id: whether this node holds a live NVMe controller to that side's
    // address (cnagent.md CN28). Every cntlr reports it, on both channels;
    // no health rule judges it (dnv-worker.md HL2). The worker's cutover
    // reads the primary's row for a migration's dst side (dnv-worker.md
    // RW18). Appended, never renumbered.
    map<uint64, ResInfo> side_id_to_path = 18;
    // The verdicts by rep_id and the group readings by grp_id. Appended,
    // never renumbered.
    map<uint64, RepairInfo> rep_id_to_repair_info = 19;
    map<uint64, GrpInfo> grp_id_to_grp_info = 20;
}

// One clone bitmap chunk's address: the source slice the chunk describes and
// the chunk's index within that slice's bitmap. Migration chunks stay flat
// uint32s — their bm_idx is an append sequence and names no slice.
message BmChunkId {
    uint32 src_slice_idx = 1;
    uint32 bm_idx = 2;
}

message BitmapInfo {
    uint64 res_id = 1;
    // bm_idx_list is migrations only; chunk_id_list is clones only.
    repeated uint32 bm_idx_list = 2;
    repeated BmChunkId chunk_id_list = 3;
}

message DnBinConf {
    uint64 extent_size = 1;
    uint32 bin0_shift = 2;
    uint32 bin1_shift = 3;
    uint32 bin2_shift = 4;
    uint32 bin3_shift = 5;
}

message AllocConf {
    uint32 dn_batch_size = 1;
    uint32 cn_batch_size = 2;
}

message HealthCheckConf {
    uint32 dn_interval = 1;
    uint32 cn_interval = 2;
    uint32 side_interval = 3;
    uint32 cntlr_interval = 4;
}

// The md check of a cluster's groups (dnv-worker.md AR16; architecture.md,
// The md check).
message MdCheckConf {
    // The days from one md check of a group to the next; zero turns the
    // check off. CreateCluster stores the default when the request carries
    // no MdCheckConf, and refuses a value above common.MaxMdCheckDays.
    uint32 interval_days = 1;
}

// The hold of an agent that answers that it is starting (dnv-worker.md
// HL8; architecture.md, Clusters).
message StartHoldConf {
    // The seconds from an agent's start during which the worker holds its
    // verdict on a starting reply; zero turns the hold off. A cluster conf
    // without the message reads common.DefaultStartHoldSeconds;
    // CreateCluster stores that default when the request carries none, and
    // refuses a value above common.MaxStartHoldSeconds.
    uint32 seconds = 1;
}

// {dnv_prefix} cluster_conf {cluster_name}
message ClusterConf {
    uint64 creation_epoch = 1;
    QosRatio qos_ratio = 2;
    BdevConf bdev_conf = 3;
    DnBinConf dn_bin_conf = 4;
    AllocConf alloc_conf = 5;
    HealthCheckConf health_check_conf = 6;
    // A cluster created without it, by a build before the md check, reads
    // a zero interval: no check. Appended, never renumbered.
    MdCheckConf md_check_conf = 7;
    // A cluster created without it, by a build before the hold, reads
    // common.DefaultStartHoldSeconds. Appended, never renumbered.
    StartHoldConf start_hold_conf = 8;
}

// {dnv_prefix} dn_global {cluster_id}
message DnGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} cn_global {cluster_id}
message CnGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} sp_global {cluster_id}
message SpGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} dn_rev {shard_code} {cluster_id} {dn_id}
message DnRev {
    string addr_port = 1;
    uint64 revision = 2;
}

// {dnv_prefix} cn_rev {shard_code} {cluster_id} {cn_id}
message CnRev {
    string addr_port = 1;
    uint64 revision = 2;
}

// {dnv_prefix} sp_rev {shard_code} {cluster_id} {sp_id}
message SpRev {
    string sp_name = 1;
    uint64 revision = 2;
}

// {dnv_prefix} dn_conf {cluster_id} {addr_port}
message DnConf {
    uint64 dn_id = 1;
    uint32 shard_code = 2;
    bool disabled = 3;
    uint64 err_epoch = 4;
    NvmeTrConf nvme_tr_conf = 5;
    string location = 6;
    repeated SidePointer side_ptr_list = 7;
    uint64 total_ext_cnt = 8;
    uint64 free_ext_cnt = 9;
    // The units of this node's metadata area held by the migration
    // destinations it hosts (architecture.md, Metadata units):
    // CreateMigration charges the units it computes and stores in the
    // migration's meta_units, and FinishMigration and CancelMigration release
    // what that field records. A write that changes only this count raises no
    // revision, and a release stops at zero. Appended, never renumbered.
    uint64 used_meta_units = 10;
}

// {dnv_prefix} cn_conf {cluster_id} {addr_port}
message CnConf {
    uint64 cn_id = 1;
    uint32 shard_code = 2;
    bool disabled = 3;
    uint64 err_epoch = 4;
    NvmeTrConf nvme_tr_conf = 5;
    string location = 6;
    repeated CntlrPointer cntlr_ptr_list = 7;
    uint64 total_ext_cnt = 8;
    uint64 free_ext_cnt = 9;
    reserved 10;
    reserved "used_meta_units";  // retired with its number, never reused: a
                                 // varint field renumbered onto 10 would
                                 // decode a stored record's count as
                                 // itself, silently; the name goes with it.
}

// {dnv_prefix} dn_capacity {cluster_id} {bin_idx} {free_ext_cnt} {addr_port}
message DnCapacity {
    string location = 1;
    // A copy of the node's DnConf.used_meta_units (architecture.md,
    // Metadata units): every transaction that writes the key writes it, and
    // every transaction that changes the count rewrites the key, so it
    // follows the record. A scan reads the node's free units from it,
    // DnCloneMetaUnitCnt less this and never below zero, and skips a node
    // short of what it needs; a value without the field reads as nothing
    // used. Appended, never renumbered.
    uint64 used_meta_units = 2;
}

// {dnv_prefix} cn_capacity {cluster_id} {free_ext_cnt} {addr_port}
message CnCapacity {
    string location = 1;
    reserved 2;
    reserved "used_meta_units";  // retired with its number, never reused: a
                                 // varint field renumbered onto 2 would
                                 // decode a stored value's count as itself,
                                 // silently; the name goes with it.
}

// {dnv_prefix} cdc {cluster_id} {shard_code} {sp_id} {ss_id}
message CdcEntry {
    string nqn = 1;
    repeated NvmeTrConf nvme_tr_conf_list = 2;
    repeated string allowed_hosts = 3;
}

// {dnv_prefix} sp_conf {cluster_id} {sp_name}
message SpConf {
    uint64 sp_id = 1;
    uint32 shard_code = 2;
    uint64 next_id = 3;
    uint32 next_dev_id = 4;
    BdevConf bdev_conf = 5;
    EventThreshold event_threshold = 6;
    repeated uint32 cntlid_slot_list = 7;
    SpLevel sp_level = 8;
    bool deleting = 9;
    repeated uint64 cntlr_id_list = 10;
    repeated uint64 slice_id_list = 11;
    repeated string td_name_list = 12;
    repeated string nqn_list = 13;
    repeated string clone_name_list = 14;
    repeated string xfer_name_list = 15;
    repeated string migr_name_list = 16;
    // The names of the pool's repairs and the leg ids of its retired legs:
    // the lists LoadSp checks the Repair and RetiredLeg keys against, each
    // changed in the transaction that puts or deletes the key it names.
    // Appended, never renumbered.
    repeated string repair_name_list = 17;
    repeated uint64 retired_leg_id_list = 18;
}

// {dnv_prefix} cntlr {cluster_id} {sp_id} {cntlr_id}
message Cntlr {
    string addr_port = 1;
    NvmeTrConf nvme_tr_conf = 2;
    uint32 cntlid_slot = 3;
    bool primary = 4;
    bool disabled = 5;
    uint64 err_epoch = 6;
    // settling is true from the moment this cntlr becomes primary (or,
    // still primary, is re-enabled) until the worker first observes it
    // clean in that role with its stack built — no row outside
    // leg_id_to_leg, grp_id_to_md_raid and side_id_to_path PROVISIONING,
    // or MISSING but for the sp_level's or the source fault's reason
    // (dnv-worker.md HL2) — or a failover demotes it.
    // AR5 holds a settling primary to cntlr_unhealthy instead of
    // primary_unhealthy when that is the longer. Existing records decode
    // false = settled.
    bool settling = 7;
    // The pool revision of the failover that made this cntlr a standby,
    // written in the failover's own transaction (model.Failover), zero when
    // none is pending: the sp worker runs its demotion hold from it even
    // when no child of its handed this cntlr its primary plan, as after a
    // restart or a handoff (dnv-worker.md RW22), and clears it, in a write
    // that bumps no revision, once that hold ends. A failover that makes
    // the cntlr the primary again clears it too. The worker's alone: the
    // cntlr's request leaves it out. Appended, never renumbered.
    uint64 demoted_revision = 8;
}

// {dnv_prefix} slice {cluster_id} {sp_id} {slice_id}
message Slice {
    uint32 slice_idx = 1;
    repeated Group meta_grp_list = 2;
    repeated Group data_grp_list = 3;
}

// {dnv_prefix} thin_device {cluster_id} {sp_id} {td_name}
message ThinDevice {
    uint64 td_id = 1;
    uint32 dev_id = 2;
    uint32 ori_id = 3;
    uint64 size = 4;
    // created is set exactly once by the sp-worker, when a cntlr has
    // reported this td's thin volume RES_STATUS_OK in every slice of the SP
    // (dnv-worker.md RW19); it is never cleared. It gates snapshot
    // creation and origin deletion (architecture.md, Thin devices) and tells
    // the cn agent that the ids exist in every slice pool, so no
    // create_thin/create_snap is ever sent for this td again (CN14; the
    // delete sent when the td leaves td_list stays ungated).
    bool created = 5;
    // torn is set at most once and never cleared: by the sp worker from the
    // first accepted report that carries the cn agent's torn mark for the td
    // (CntlrInfo.ThinInfo.torn; dnv-worker.md RW19), created or not, and
    // kept by the created flip. False proves nothing when the primary's
    // node never came back, or lost its local store, after the tear
    // (architecture.md, Known limits). Appended, never renumbered.
    bool torn = 6;
}

// {dnv_prefix} subsystem {cluster_id} {sp_id} {nqn}
message Subsystem {
    uint64 ss_id = 1;
    string serial = 2;
    string model = 3;
    repeated Namespace ns_list = 4;
    repeated string allowed_hosts = 5;
}

// {dnv_prefix} clone {cluster_id} {sp_id} {clone_name}
message Clone {
    uint64 clone_id = 1;
    repeated NvmeTrConf src_tr_conf_list = 2;
    string src_nqn = 3;
    uint32 src_ns_idx = 4;
    uint32 src_slice_cnt = 5;
    uint64 src_stripe_size = 6;
    uint64 src_block_size = 7;
    uint64 dst_td_id = 8;
    DmCloneConf dm_clone_conf = 9;
    bool auto_resume = 10;
    reserved 11;
    reserved "bm_cnt";  // retired with its number, never reused: a varint
                        // field renumbered onto 11 would decode a stored
                        // record's counter as itself, silently; the name
                        // goes with it.
    // The clone-delete latch (architecture.md, Clones, DeleteClone;
    // dnv-worker.md, The clone drain): DeleteClone sets it and returns, and
    // the sp coordinator drains the chunk keys. Appended, never renumbered —
    // a renumbered field decodes silently into unknown fields rather than
    // failing.
    bool deleting = 12;
    reserved 13;
    reserved "meta_units";  // retired with its number, never reused: a
                            // varint field renumbered onto 13 would decode
                            // a stored record's count as itself, silently;
                            // the name goes with it.
    // The clone meta group (architecture.md, Terminology and object model):
    // the one group the clone owns, one leg or the legs of an md-raid1 as
    // the pool's redundancy gives a group, whose sides are charged to disk
    // nodes and pointed at from their DnConf as a slice's sides are. Its
    // group, leg and side ids come from SpConf.next_id with every other id
    // of the pool. The primary's dm-clone of the clone keeps its metadata on
    // it (cnagent.md CN18). The clone drain's final transaction gives its
    // sides back (dnv-worker.md CLD9). One group and not a list, so the
    // name keeps it apart from a slice's meta_grp_list. A record without it
    // decodes as a clone with no group, which no clone-keyed op takes and
    // the clone drain deletes all the same (dnv-worker.md MD6). Appended,
    // never renumbered.
    Group meta_grp = 14;
}

// {dnv_prefix} clone_bitmap {cluster_id} {sp_id} {clone_name} {src_slice_idx} {bm_idx}
message CloneBitmap {
    bytes bitmap = 1;
}

// {dnv_prefix} transfer {cluster_id} {sp_id} {xfer_name}
message Transfer {
    uint64 xfer_id = 1;
    string ori_nqn = 2;
    uint32 ori_ns_idx = 3;
    repeated string allowed_hosts = 4;
    bool auto_suspend = 5;
}

// {dnv_prefix} migration {cluster_id} {sp_id} {migr_name}
message Migration {
    uint64 migr_id = 1;
    uint64 src_side_id = 2;
    uint64 dst_side_id = 3;
    DmCloneConf dm_clone_conf = 4;
    reserved 5;
    reserved "bm_cnt";  // retired with its number, never reused: the worker
                        // reads a migration's bitmap itself and keeps it in
                        // memory (dnv-worker.md BM7).
    // The metadata units this migration holds on its destination disk node
    // (architecture.md, Metadata units): common.CloneMetaUnits of the moved
    // side's bytes (its group's ext_cnt times the cluster's extent_size) and
    // the pool's data_block_size, set by CreateMigration and never changed.
    // FinishMigration and CancelMigration release exactly this. Appended,
    // never renumbered.
    uint64 meta_units = 6;
    // Set by CreateMigration; cleared by the worker's cutover, once the
    // primary reports a live path to the dst side and the dst side reports
    // RES_REASON_AWAITING_CUTOVER (dnv-worker.md RW18), and never set again.
    // While it is set the src side serves on, the dst side goes no further
    // than its metadata wrapper and its exports on dm-error
    // (architecture.md, Migration), and FinishMigration refuses, with force
    // or without. A record without the field decodes false, read as a
    // cutover that has started (architecture.md, Upgrade in lockstep).
    // Appended, never renumbered.
    bool cutover_pending = 7;
}

// The stage of a repair. CreateRepair writes CREATED; the sp worker moves a
// CREATED repair to STARTED once the primary reports that the new leg holds
// a place in the group's array and md holds nothing on the bad leg, and to
// ABORTED once the abort flag is set and the primary confirms the abort.
// FinishRepair takes a STARTED repair,
// CancelRepair an ABORTED one, and TryToAbortRepair a CREATED one. Appended
// values only, never renumbered.
enum RepStage {
    REP_STAGE_CREATED = 0;
    REP_STAGE_STARTED = 1;
    REP_STAGE_ABORTED = 2;
}

// {dnv_prefix} repair {cluster_id} {sp_id} {rep_name}
message Repair {
    uint64 rep_id = 1;
    // The group the repair repairs, found in the parent the two fields
    // below name. A group never moves to another parent, so they stay true
    // for the repair's life.
    uint64 grp_id = 2;
    RepStage rep_stage = 3;
    // The legs that take the bad legs' places at FinishRepair: full Leg
    // records, each with its one side, which live here until then. A leg
    // taken from a retired leg keeps its leg id, leg_idx and side; a fresh
    // one takes ids from SpConf.next_id and the next free leg_idx of the
    // group.
    repeated Leg new_leg_list = 4;
    // The leg ids of the group's leg_list legs the repair replaces. They
    // stay in leg_list until FinishRepair, so the record keeps only their
    // ids.
    repeated uint64 bad_leg_id_list = 5;
    // Set by TryToAbortRepair on a CREATED repair, and never cleared.
    bool try_to_abort = 6;
    // The parent of the group: the slice that holds it, zero for a clone
    // meta group, and the clone that holds it, empty for a slice's group.
    // Exactly one is set.
    uint64 slice_id = 7;
    string clone_name = 8;
    // The retired_epoch of each new leg taken from a retired leg, keyed by
    // its leg id: CancelRepair turns such a leg back into its retired leg
    // with this time. A fresh new leg has no entry.
    map<uint64, uint64> new_leg_id_to_retired_epoch = 9;
    // The operator's force (CreateRepairRequest.force): the primary adds a
    // new leg taken from a retired leg, or after an abort the bad leg, whose
    // md superblock carries another identity than the running array's,
    // which md copies over (cnagent.md CN12). Never set on a worker's
    // repair. Appended, never renumbered.
    bool force = 10;
    // Set by ForceStartGroup on the group's open repair, and by CreateRepair
    // on an operator's repair whose bad leg it takes for an identity reason:
    // FinishRepair makes each bad leg a retired leg with keep set, since
    // after a forced start from another leg the leg it replaces can hold
    // newer data than the array, and a leg of another identity can hold
    // data the array lacks (architecture.md, Repair, Forced start; Repairs,
    // A leg of another identity). Appended, never renumbered.
    bool keep_bad_legs = 11;
    // The keep flag of each new leg taken from a retired leg that carried
    // it, keyed by its leg id, true alone: CancelRepair gives such a leg
    // back as a retired leg with keep set, as it gives its retired_epoch
    // back. Appended, never renumbered.
    map<uint64, bool> new_leg_id_to_keep = 12;
    // The partial mark of each new leg taken from a retired leg, keyed by
    // its leg id, true alone: set by CreateRepair from a retired leg that
    // carried it, and by the sp worker once the primary's report shows md
    // holding the leg (dnv-worker.md AR11); CancelRepair gives the leg back
    // as a retired leg with partial set. Appended, never renumbered.
    map<uint64, bool> new_leg_id_to_partial = 13;
}

// {dnv_prefix} retired_leg {cluster_id} {sp_id} {leg_id}
message RetiredLeg {
    // The group the leg left and its leg_idx there.
    uint64 grp_id = 1;
    uint32 leg_idx = 2;
    // The leg's one side, which keeps its extents, its place in its disk
    // node's side_ptr_list and the data as it was when the leg left, save
    // what md wrote on it while it was the new leg of a repair that was then
    // cancelled, and the zero a forced start left on its superblock
    // (architecture.md, Repair; Known limits). Its err_epoch is the side's
    // health.
    Side side = 3;
    // The time FinishRepair retires the leg at, in unix seconds as
    // err_epoch is; the retire timer measures the leg's age from it.
    uint64 retired_epoch = 4;
    // The parent of the group, as Repair.slice_id and Repair.clone_name.
    uint64 slice_id = 5;
    string clone_name = 6;
    // Keep the leg until an operator deletes it: neither the retire timer
    // nor the give-back at the retired-leg bound takes it (architecture.md,
    // Retired legs). ForceStartGroup sets it on every retired leg of the
    // group, FinishRepair on the bad leg of a repair with keep_bad_legs,
    // and UpdateRetiredLegKeep sets or clears it. Appended, never
    // renumbered.
    bool keep = 7;
    // md held the leg as a repair's new leg, taken back from this retired
    // leg, before the repair was cancelled: md wrote its superblock and
    // possibly part of the array onto it, so it is no longer the whole copy
    // it was. CancelRepair copies it from Repair.new_leg_id_to_partial, and
    // CreateRepair copies it back into the repair that takes the leg back.
    // A forced start refuses to name such a leg unless its overrides name
    // PARTIAL. Appended, never renumbered.
    bool partial = 8;
}

// {dnv_prefix} sp_id_to_name {cluster_id} {sp_id}
message SpName {
    string sp_name = 1;
}

// {dnv_prefix} worker {role} {seed}
message WorkerReg {
    // The writer's unix seconds at the put. Informational: liveness is judged
    // by the observer's own clock since the put it last saw (dnv-worker.md
    // VW3/VW4), never by comparing this with local time.
    uint64 epoch = 1;
}

