message GetDnSizeRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
}

message GetDnSizeReply {
    uint64 size = 1;
    // The machine's host name, read on every call; empty when the read
    // failed (dnagent.md SH34). A disk node created with no location takes
    // it as its location (architecture.md, Disk nodes).
    string host_name = 2;
}

message SyncupDnRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    uint64 revision = 3;
    repeated SidePointer side_pointer_list = 4;
    uint64 extent_size = 5;
}

message SyncupDnReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    DnInfo dn_info = 3;
    ObsStamp obs_stamp = 4;
    // When the agent saved the request to its local store. Every reply that
    // accepts the request carries it; one that refuses the request carries
    // none, a refusal for a save that failed included (architecture.md,
    // Live-state reporting).
    google.protobuf.Timestamp save_time = 5;
}

message SyncupSideRequest {
    message SideConf {
        uint64 ext_cnt = 1;
        uint32 cntlid_slot = 2;
        uint64 primary_cn_id = 3;
        repeated uint64 standby_id_list = 4;
        SpLevel sp_level = 5;
        bool provisioned = 6;
        uint64 zero_bytes = 7;  // the prefix of the side to zero, from the group
    }
    message MigrSrcConf {
        uint64 migr_id = 1;
        uint64 dst_side_id = 2;  // for the record; read by no agent (architecture.md, service DiskNodeAgent)
        uint64 dst_dn_id = 3;
        bool dst_provisioned = 4;
        // The worker copies Migration.cutover_pending here and sends
        // dst_provisioned true only once it is false (dnv-worker.md RW15).
        // While dst_provisioned is false it changes only the text of the
        // migr_src_info rows (dnagent.md DN12). Appended, never renumbered.
        bool cutover_pending = 5;
    }
    message MigrDstConf {
        uint64 migr_id = 1;
        uint64 src_side_id = 2;  // for the record; read by no agent (architecture.md, service DiskNodeAgent)
        uint64 src_dn_id = 3;
        NvmeTrConf src_nvme_tr_conf = 4;
        uint64 block_size = 5;
        uint64 meta_blocks = 6;
        DmCloneConf dm_clone_conf = 7;
        reserved 8;
        reserved "bm_cnt";  // retired with its number, never reused
        // The worker copies Migration.cutover_pending here (dnv-worker.md
        // RW15). While it is true a provisioned dst side builds its
        // metadata wrapper and its per-CN stacks, connects to no source and
        // builds no dm-clone, and once the wrapper stands reports
        // RES_REASON_AWAITING_CUTOVER (dnagent.md DN13, DN18). Appended,
        // never renumbered.
        bool cutover_pending = 9;
    }
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    SidePointer side_pointer = 3;
    uint64 revision = 4;
    SideConf side_conf = 5;
    MigrSrcConf migr_src_conf = 6;
    MigrDstConf migr_dst_conf = 7;
}

message SyncupSideReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    SideInfo side_info = 3;
    BitmapInfo bm_info = 4;
    ObsStamp obs_stamp = 5;
    // As SyncupDnReply.save_time.
    google.protobuf.Timestamp save_time = 6;
}

message PushMigrBitmapRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    SidePointer side_pointer = 3;
    uint64 migr_id = 4;
    uint32 bm_idx = 5;
    bytes bitmap = 6;
}

message PushMigrBitmapReply {
    AgentReply agent_reply = 1;
}

message GetDnInfoRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    // Read the disk's counters at the call, into the reply's disk_io_stats
    // (dnagent.md DN16). Only InspectDiskNode sets it.
    // Appended, never renumbered.
    bool read_io_stats = 3;
}

message GetDnInfoReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    DnInfo dn_info = 3;
    ObsStamp obs_stamp = 4;
    // Set only for a request with read_io_stats, of the disk node the agent
    // holds. Appended, never renumbered.
    DevIoStats disk_io_stats = 5;
}

message GetSideInfoRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    SidePointer side_pointer = 3;
}

message GetSideInfoReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    SideInfo side_info = 3;
    ObsStamp obs_stamp = 4;
}

message CheckDnRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    uint64 revision = 3;
    bool show_info = 4;
    // The trace id of the worker round that sent this request
    // (grpc.md T3): the stream's metadata carries only the id of
    // the round that opened it, so each round names its own here
    // and the agent runs the round under it. Empty keeps the
    // stream's id.
    string trace_id = 5;
}

message CheckDnReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    DnInfo dn_info = 3;
    ObsStamp obs_stamp = 4;
}

message CheckSideRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    SidePointer side_pointer = 3;
    uint64 revision = 4;
    bool show_info = 5;
    // As CheckDnRequest.trace_id.
    string trace_id = 6;
}

message CheckSideReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    SideInfo side_info = 3;
    ObsStamp obs_stamp = 4;
}

service DiskNodeAgent {
    rpc GetDnSize(GetDnSizeRequest) returns (GetDnSizeReply) {}
    rpc SyncupDn(SyncupDnRequest) returns (SyncupDnReply) {}
    rpc SyncupSide(SyncupSideRequest) returns (SyncupSideReply) {}
    rpc PushMigrBitmap(PushMigrBitmapRequest) returns (PushMigrBitmapReply) {}
    rpc GetDnInfo(GetDnInfoRequest) returns (GetDnInfoReply) {}
    rpc GetSideInfo(GetSideInfoRequest) returns (GetSideInfoReply) {}
    rpc CheckDn(stream CheckDnRequest) returns (stream CheckDnReply) {}
    rpc CheckSide(stream CheckSideRequest) returns (stream CheckSideReply) {}
}

message GetCnSizeRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
}

message GetCnSizeReply {
    uint64 size = 1;
    // The machine's host name, as GetDnSizeReply's (dnagent.md SH34). A
    // controller node created with no location takes it as its location
    // (architecture.md, Controller nodes).
    string host_name = 2;
}

message SyncupCnRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    uint64 revision = 3;
    repeated CntlrPointer cntlr_pointer_list = 4;
    QosRatio qos_ratio = 5;
}

message SyncupCnReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    CnInfo cn_info = 3;
    ObsStamp obs_stamp = 4;
    // As SyncupDnReply.save_time.
    google.protobuf.Timestamp save_time = 5;
}

message SyncupCntlrRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    CntlrPointer cntlr_pointer = 3;
    uint64 revision = 4;
    BdevConf bdev_conf = 5;
    SpLevel sp_level = 6;
    Cntlr cntlr = 7;
    map<string, Slice> id_to_slice = 8;
    repeated ThinDevice td_list = 9;
    map<string, Subsystem> nqn_to_subsystem = 10;
    repeated Clone clone_list = 11;
    repeated Transfer xfer_list = 12;
    reserved 13;
    reserved "migr_list";  // never reused: a length-delimited field
                           // renumbered onto 13 would decode a stored
                           // request's migrations as its own value,
                           // silently; the name goes with it.
    // The pool's repairs by name. The cntlr finds a group's repair through
    // Group.rep_name. Appended, never renumbered.
    map<string, Repair> name_to_repair = 14;
    // The pool's EventThreshold.leg_fast_io_fail_tmo, resolved: the fast IO
    // fail timeout the cn agent connects the cntlr's legs with (cnagent.md
    // CN10). Zero, as a request from a worker without the field carries
    // it, is DefaultNvmeFastIoFailTmo. Appended, never renumbered.
    uint32 leg_fast_io_fail_tmo = 15;
}

message SyncupCntlrReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    CntlrInfo cntlr_info = 3;
    repeated BitmapInfo bm_info_list = 4;
    ObsStamp obs_stamp = 5;
    // As SyncupDnReply.save_time.
    google.protobuf.Timestamp save_time = 6;
}

// The cn agent's local-store record of one cntlr's torn marks (cnagent.md
// CN14): the td_ids of the snapshots whose snapshot pre-pass tore them,
// saved at once and loaded by the startup reconcile (CN2). It names its
// cntlr, as every store file does by its content (dnagent.md SH6).
message TornMarks {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    CntlrPointer cntlr_pointer = 3;
    repeated uint64 td_id_list = 4;
}

message PushCloneBitmapRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    CntlrPointer cntlr_pointer = 3;
    uint64 clone_id = 4;
    uint32 src_slice_idx = 5;
    uint32 bm_idx = 6;
    bytes bitmap = 7;
}

message PushCloneBitmapReply {
    AgentReply agent_reply = 1;
}

message GetCnInfoRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
}

message GetCnInfoReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    CnInfo cn_info = 3;
    ObsStamp obs_stamp = 4;
}

message GetCntlrInfoRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    CntlrPointer cntlr_pointer = 3;
    // Read each leg's and namespace device's counters at the call, into the
    // reply's io_stats (cnagent.md CN23). Only InspectCntlr sets it.
    // Appended, never renumbered.
    bool read_io_stats = 4;
}

message GetCntlrInfoReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    CntlrInfo cntlr_info = 3;
    ObsStamp obs_stamp = 4;
    // Set only for a request with read_io_stats, of a cntlr the agent holds.
    // Appended, never renumbered.
    CntlrIoStats io_stats = 5;
}

message GetThinDeviceBmRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    uint64 sp_id = 3;
    uint64 cntlr_id = 4;
    uint64 td_id = 5;
    uint32 slice_idx = 6;
    uint64 start_block = 7;
    uint64 block_cnt = 8;
}

message GetThinDeviceBmReply {
    bytes bitmap = 1;
}

message GetLegBmRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    uint64 sp_id = 3;
    uint64 cntlr_id = 4;
    uint64 leg_id = 5;
    uint64 start_block = 6;
    uint64 block_cnt = 7;
}

message GetLegBmReply {
    bytes bitmap = 1;
}

// One member of a group as the primary reads it for InspectGrp (cnagent.md
// CN12, the superblock read): a leg of the group's leg_list or a new leg of
// its repair.
message InspectedMember {
    uint64 leg_id = 1;
    // "leg", "bad leg" (a leg of leg_list that is the repair's bad leg) or
    // "new leg".
    string kind = 2;
    // The leg serves by the read path's test, which builds nothing: every
    // controller of its subsystem known, a namespace and a live, optimized
    // path; so its superblock is read. A leg the converge would connect
    // first reads false.
    bool available = 3;
    // Why the superblock read did not answer, or why no read was made: ""
    // when it answered.
    string read_error = 4;
    // The superblock read's answer: has_superblock false is a member with no
    // md superblock; the rest describe the one it found.
    bool has_superblock = 5;
    string uuid = 6;
    uint64 events = 7;
    // md's role of the member: a place number, "spare" or "faulty".
    string role = 8;
    bool recovering = 9;
    uint64 recovery_offset = 10;
    uint32 bad_blocks = 11;
    // md's view of the member in the group's array that is there: its
    // state words and its slot, both "" when md holds no member on the leg.
    string md_state = 12;
    string md_slot = 13;
}

// What CN12's forced start would do from a mark naming one leg, with no
// mdadm command run (cnagent.md CN12, InspectGrp).
message ForcedStartDryRun {
    // Why the start would not run, "" when it would.
    string refusal = 1;
    // The members it would zero, in order.
    repeated uint64 zero_leg_id_list = 2;
    // The assembly's update: "uuid", or "uuid,force-no-bbl" when the named
    // leg carries a bad-block list.
    string update = 3;
    // An array of the group is there and does not run, so the start stops
    // it first, before the checks a refusal may come from; false when the
    // gateway's own refusal stands, as no mark would be written.
    bool stops_array = 4;
    // Every refusal an override passes that the start's checks met, passed
    // or not, in the order they meet them: the gateway's partial mark first,
    // then the named leg's bad-block list, then each older member.
    repeated ForcedStartRefusal refusal_list = 5;
}

message InspectGrpRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    uint64 sp_id = 3;
    uint64 cntlr_id = 4;
    uint64 grp_id = 5;
    // With a leg id, the reply also says what a forced start from that leg
    // would do, passing the refusals override_list names.
    uint64 leg_id = 6;
    reserved 7;
    reserved "force";  // retired with its number, never reused
    repeated ForcedStartOverride override_list = 8;
}

message InspectGrpReply {
    // The state of the group's array that is there, "" when there is none.
    string array_state = 1;
    repeated InspectedMember member_list = 2;
    // Set only when the request names a leg.
    ForcedStartDryRun dry_run = 3;
}

message CheckCnRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    uint64 revision = 3;
    bool show_info = 4;
    // As CheckDnRequest.trace_id.
    string trace_id = 5;
}

message CheckCnReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    CnInfo cn_info = 3;
    ObsStamp obs_stamp = 4;
}

message CheckCntlrRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    CntlrPointer cntlr_pointer = 3;
    uint64 revision = 4;
    bool show_info = 5;
    // As CheckDnRequest.trace_id.
    string trace_id = 6;
}

message CheckCntlrReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    CntlrInfo cntlr_info = 3;
    ObsStamp obs_stamp = 4;
}

service ControllerNodeAgent {
    rpc GetCnSize(GetCnSizeRequest) returns (GetCnSizeReply) {}
    rpc SyncupCn(SyncupCnRequest) returns (SyncupCnReply) {}
    rpc SyncupCntlr(SyncupCntlrRequest) returns (SyncupCntlrReply) {}
    rpc PushCloneBitmap(PushCloneBitmapRequest) returns (PushCloneBitmapReply) {}
    rpc GetCnInfo(GetCnInfoRequest) returns (GetCnInfoReply) {}
    rpc GetCntlrInfo(GetCntlrInfoRequest) returns (GetCntlrInfoReply) {}
    rpc GetThinDeviceBm(GetThinDeviceBmRequest) returns (GetThinDeviceBmReply) {}
    rpc GetLegBm(GetLegBmRequest) returns (GetLegBmReply) {}
    rpc InspectGrp(InspectGrpRequest) returns (InspectGrpReply) {}
    rpc CheckCn(stream CheckCnRequest) returns (stream CheckCnReply) {}
    rpc CheckCntlr(stream CheckCntlrRequest) returns (stream CheckCntlrReply) {}
}

// agent-local on-disk metadata ([D13]); never sent over any RPC.

message DnDiskHeader {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    uint64 extent_size = 3;
    uint64 format_uuid = 4;
    uint64 data_offset = 5;        // = DnDataOffset when written
    uint64 clone_meta_offset = 6;  // = DnCloneMetaOffset
    uint64 clone_meta_size = 7;    // = DnCloneMetaSize
}

message DnDiskTable {
    message ExtentRun {
        uint64 start = 1;  // extent index within the data area
        uint64 count = 2;
    }
    message SideRecord {
        uint64 sp_id = 1;
        uint64 side_id = 2;
        reserved 3, 5;                    // retired, never reused: a renumbered field decodes silently
        repeated ExtentRun run_list = 4;  // ordered; concat = side device
        uint64 zero_bytes = 6;            // the prefix to zero, set at allocation
        uint64 zeroed_bytes = 7;          // bytes zeroed from the side's start
    }
    message CloneMetaRecord {
        uint64 sp_id = 1;
        uint64 migr_id = 2;
        uint64 unit_start = 3;  // in DnCloneMetaUnit units within the area
        uint64 unit_count = 4;
    }
    repeated SideRecord side_list = 1;
    repeated CloneMetaRecord clone_meta_list = 2;
}
