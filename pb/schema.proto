message ForceStartGroupRequest {
    string cluster_name = 1;
    string sp_name = 2;
    SpRev sp_rev = 3;
    uint64 grp_id = 4;
    // The leg the group's array starts from; zero with cancel.
    uint64 leg_id = 5;
    // Withdraw the group's mark instead of writing one.
    bool cancel = 6;
    reserved 7;
    reserved "force";  // retired with its number, never reused: an older
                       // client's force, which passed every refusal,
                       // decodes as unknown and passes none.
    // The kinds of refusal the start passes, each named once, none NONE:
    // OLDER_LEG, a full member the start would zero that holds a higher md
    // change count of the named leg's identity; BAD_BLOCKS, a bad-block list
    // on the named leg, which the start drops; PARTIAL, a named taken-back
    // leg that carries the partial mark. Empty with cancel. Appended, never
    // renumbered.
    repeated ForcedStartOverride override_list = 8;
}

message ForceStartGroupReply {
    uint64 grp_id = 1;
    // The revision the mark carries (ForcedStart.revision); zero for a
    // cancel.
    uint64 revision = 2;
}

message UpdateGroupOperatorInChargeRequest {
    string cluster_name = 1;
    string sp_name = 2;
    SpRev sp_rev = 3;
    uint64 grp_id = 4;
    // The value the group's operator_in_charge takes: true sets it, false
    // clears it.
    bool operator_in_charge = 5;
}

message UpdateGroupOperatorInChargeReply {
    uint64 grp_id = 1;
}

message UpdateRetiredLegKeepRequest {
    string cluster_name = 1;
    string sp_name = 2;
    SpRev sp_rev = 3;
    uint64 leg_id = 4;
    // The value the retired leg's keep takes: true sets it, false clears
    // it.
    bool keep = 5;
}

message UpdateRetiredLegKeepReply {
    uint64 leg_id = 1;
}

message InspectGroupRequest {
    string cluster_name = 1;
    string sp_name = 2;
    uint64 grp_id = 3;
    // With a leg id, the reply says what a forced start from that leg would
    // do (the dry run), passing the refusals override_list names, as
    // ForceStartGroupRequest.override_list; empty with no leg id.
    uint64 leg_id = 4;
    reserved 5;
    reserved "force";  // retired with its number, never reused
    repeated ForcedStartOverride override_list = 6;
}

// One leg of a group as InspectGroup shows it: the primary's read of the
// member, and what etcd and the primary's latest report say of the leg.
message InspectedLeg {
    InspectedMember member = 1;
    // The disk node of the leg's side, and the leg's and that side's health
    // epochs, from the pool's records.
    string addr_port = 2;
    uint64 leg_err_epoch = 3;
    uint64 side_err_epoch = 4;
    // The leg's row in the primary's latest report, absent when the report
    // holds none.
    ResInfo row = 5;
}

message InspectGroupReply {
    uint64 grp_id = 1;
    // The primary cntlr the gateway asked.
    uint64 cntlr_id = 2;
    string array_state = 3;
    repeated InspectedLeg leg_list = 4;
    // The group's retired legs, which no cntlr connects: their records'
    // leg ids, with no read.
    repeated uint64 retired_leg_id_list = 5;
    // Set only when the request names a leg.
    ForcedStartDryRun dry_run = 6;
    // The stamp of the primary's report the rows come from.
    ObsStamp obs_stamp = 7;
    // The revision of the request the primary holds, which its members and
    // the dry run are read from, and the pool's revision at the gateway's
    // read: below it, a newer request is on its way, which the start acts
    // on.
    uint64 applied_revision = 8;
    uint64 sp_revision = 9;
}

message GetThinDeviceBitmapRequest {
    string cluster_name = 1;
    string sp_name = 2;
    string td_name = 3;
    uint32 slice_idx = 4;
    uint64 start_block = 5;
    uint64 block_cnt = 6;
}

message GetThinDeviceBitmapReply {
    bytes bitmap = 1;
}

