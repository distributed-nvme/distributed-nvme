message SyncupDnRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    uint64 revision = 3;
    repeated SidePointer side_pointer_list = 4;
    uint64 extent_size = 5;
}

message SyncupDnReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    DnInfo dn_info = 3;
    ObsStamp obs_stamp = 4;
    // When the agent saved the request to its local store; unset when it
    // saved none.
    google.protobuf.Timestamp save_time = 5;
}

message SyncupSideRequest {
    message SideConf {
        uint64 ext_cnt = 1;
        uint32 cntlid_slot = 2;
        uint64 primary_cn_id = 3;
        repeated uint64 standby_id_list = 4;
        SpLevel sp_level = 5;
        bool provisioned = 6;
        uint64 zero_bytes = 7;  // the prefix of the side to zero, from the group
    }
    message MigrSrcConf {
        uint64 migr_id = 1;
        uint64 dst_side_id = 2;
        uint64 dst_dn_id = 3;
        bool dst_provisioned = 4;
        // The worker copies Migration.cutover_pending here and sends
        // dst_provisioned true only once it is false (dnv-worker.md RW15).
        // While dst_provisioned is false it changes only the text of the
        // migr_src_info rows (dnagent.md DN12). Appended, never renumbered.
        bool cutover_pending = 5;
    }
    message MigrDstConf {
        uint64 migr_id = 1;
        uint64 src_side_id = 2;
        uint64 src_dn_id = 3;
        NvmeTrConf src_nvme_tr_conf = 4;
        uint64 block_size = 5;
        uint64 meta_blocks = 6;
        DmCloneConf dm_clone_conf = 7;
        uint32 bm_cnt = 8;
        // The worker copies Migration.cutover_pending here (dnv-worker.md
        // RW15). While it is true a provisioned dst side builds its
        // metadata wrapper and its per-CN stacks, connects to no source and
        // builds no dm-clone, and once the wrapper stands reports
        // RES_REASON_AWAITING_CUTOVER (dnagent.md DN13, DN18). Appended,
        // never renumbered.
        bool cutover_pending = 9;
    }
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    SidePointer side_pointer = 3;
    uint64 revision = 4;
    SideConf side_conf = 5;
    MigrSrcConf migr_src_conf = 6;
    MigrDstConf migr_dst_conf = 7;
}

message SyncupSideReply {
    AgentReply agent_reply = 1;
    uint64 revision = 2;
    SideInfo side_info = 3;
    BitmapInfo bm_info = 4;
    ObsStamp obs_stamp = 5;
    // As SyncupDnReply.save_time.
    google.protobuf.Timestamp save_time = 6;
}

message PushMigrBitmapRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    SidePointer side_pointer = 3;
    uint64 migr_id = 4;
