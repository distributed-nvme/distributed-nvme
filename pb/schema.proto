// agent-local on-disk metadata ([D13]); never sent over any RPC.

message DnDiskHeader {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    uint64 extent_size = 3;
    uint64 format_uuid = 4;
    uint64 data_offset = 5;        // = DnDataOffset when written
    uint64 clone_meta_offset = 6;  // = DnCloneMetaOffset
    uint64 clone_meta_size = 7;    // = DnCloneMetaSize
}

message DnDiskTable {
    message ExtentRun {
        uint64 start = 1;  // extent index within the data area
        uint64 count = 2;
    }
    message SideRecord {
        uint64 sp_id = 1;
        uint64 side_id = 2;
        reserved 3, 5;                    // retired, never reused: a renumbered field decodes silently
        repeated ExtentRun run_list = 4;  // ordered; concat = side device
        uint64 zero_bytes = 6;            // the prefix to zero, set at allocation
        uint64 zeroed_bytes = 7;          // bytes zeroed from the side's start
    }
    message CloneMetaRecord {
        uint64 sp_id = 1;
        uint64 migr_id = 2;
        uint64 unit_start = 3;  // in DnCloneMetaUnit units within the area
        uint64 unit_count = 4;
    }
    repeated SideRecord side_list = 1;
    repeated CloneMetaRecord clone_meta_list = 2;
}
