message GetClusterCapacityRequest {
    string cluster_name = 1;
    // The pool shape the space answer is for: the legs of a group, the
    // cntlrs and the slices of a pool. Zero takes what CreateStoragePool
    // takes for it: the legs of the cluster's stored bdev_conf, and the
    // default cntlr and slice counts (architecture.md, Clusters). Appended,
    // never renumbered.
    uint32 leg_cnt = 2;
    uint32 cntlr_cnt = 3;
    uint32 slice_cnt = 4;
}

// CapacityLimit is the limit a cluster reaches first for pools of one shape
// (architecture.md, Clusters, GetClusterCapacity), judged in this order: the
// pool ceiling, too few controller nodes, too few disk nodes, disk nodes in
// too few locations, then whichever side holds less: disk space or the
// controller nodes' budgets; when no pool of the shape fits, the side that
// has no room.
enum CapacityLimit {
    CAPACITY_LIMIT_UNSPECIFIED = 0;
    CAPACITY_LIMIT_POOL_CEILING = 1;
    CAPACITY_LIMIT_CN_COUNT = 2;
    CAPACITY_LIMIT_DN_COUNT = 3;
    CAPACITY_LIMIT_DN_LOCATIONS = 4;
    CAPACITY_LIMIT_DN_SPACE = 5;
    CAPACITY_LIMIT_CN_BUDGET = 6;
}

// ClusterSpace is GetClusterCapacity's answer for one pool shape, computed
// from the records the reply's entries copy (architecture.md, Clusters,
// GetClusterCapacity): an estimate, as those records are. Raw is every
// record's extents, charged the extents its pointers hold, free the free
// extents of the nodes a scan can offer; every byte count is extents times
// the cluster's extent size.
message ClusterSpace {
    // The request's counts, zeros resolved.
    uint32 leg_cnt = 1;
    uint32 cntlr_cnt = 2;
    uint32 slice_cnt = 3;
    uint64 dn_raw_bytes = 4;
    uint64 dn_charged_bytes = 5;
    uint64 dn_free_bytes = 6;
    uint64 cn_raw_bytes = 7;
    uint64 cn_charged_bytes = 8;
    uint64 cn_free_bytes = 9;
    // The group space pools of this shape can still place, one copy: zero
    // when a count limit is reached or when no pool of the shape fits.
    uint64 placeable_bytes = 10;
    // The largest first data group, in extents, a new pool of this shape
    // can get: sure to get when every disk node is a location of its own
    // (architecture.md, Clusters, GetClusterCapacity).
    uint64 largest_init_ext_cnt = 11;
    CapacityLimit limit = 12;
    // The cluster's pools, those being deleted included.
    uint32 pool_cnt = 13;
}

// DnCapacityEntry is one disk node's recorded counts and flags as
// GetClusterCapacity reads them off its DnConf (architecture.md, Clusters):
// no computed member, and the side pointers reduced to their count.
// Appended, never renumbered.
message DnCapacityEntry {
    string location = 1;
    bool disabled = 2;
    uint64 err_epoch = 3;
    uint64 total_ext_cnt = 4;
    uint64 free_ext_cnt = 5;
    uint32 side_cnt = 6;
}

// CnCapacityEntry is the controller-node twin of DnCapacityEntry, read off a
// CnConf, its cntlr pointers reduced to their count. Appended, never
// renumbered.
message CnCapacityEntry {
    string location = 1;
    bool disabled = 2;
    uint64 err_epoch = 3;
    uint64 total_ext_cnt = 4;
    uint64 free_ext_cnt = 5;
    uint32 cntlr_cnt = 6;
}

message GetClusterCapacityReply {
    string cluster_name = 1;
    uint64 extent_size = 2;
    map<string, DnCapacityEntry> addr_port_to_dn = 3;
    map<string, CnCapacityEntry> addr_port_to_cn = 4;
    // The space answer for the request's pool shape. Always set by a
    // gateway that knows it; a reader treats its absence as an error.
    // Appended, never renumbered.
    ClusterSpace space = 5;
}

// GetClusterStatusRequest asks for one page of the status read
// (architecture.md, Clusters): the pools are paged as ListStoragePools pages
// them.
message GetClusterStatusRequest {
    string cluster_name = 1;
    uint32 count = 2;
    string page_token = 3;
}

// StatusKind is why the status read lists a row (architecture.md, Clusters,
// GetClusterStatus). Appended values only, never renumbered.
enum StatusKind {
    // Never sent.
    STATUS_KIND_NONE = 0;
    // A record a pool's or a node's records name is absent from etcd: a key
    // the pool's lists name, a node record a side or a cntlr points at, a
    // pool's or a node's revision key, or a pool's id-to-name record, which
    // may also name another pool; or a node record that does not decode.
    STATUS_KIND_LOST_RECORD = 1;
    // The read holds no state of the pool to judge it by: records that do
    // not load, no primary, a primary's agent that did not answer, holds
    // no state of the cntlr or is starting, an observation older than the
    // worker accepts, or a report behind the pool's revision while the
    // primary's health epoch is set, which is a syncup still on its way or
    // one its agent refuses or fails, the read cannot tell which. Its
    // status is RES_STATUS_UNKNOWN.
    STATUS_KIND_REPORT = 2;
    // The pool as a whole: being deleted, a level above read-write, its
    // primary disabled, or a stored conf the worker refuses.
    STATUS_KIND_POOL = 3;
    // A slice's thin pool out of data space or out of metadata space.
    STATUS_KIND_SPACE = 4;
    // A grow of a slice past its mark that the worker cannot run.
    STATUS_KIND_GROW = 5;
    // A row of the primary's report that reads RES_STATUS_ERROR, or a leg's
    // row with an identity reason.
    STATUS_KIND_ROW = 6;
    // A health epoch the worker set.
    STATUS_KIND_HEALTH = 7;
    // A group's reading or mark: an array not whole, a refused add, the
    // operator in charge, a forced-start mark, a member with bad blocks.
    STATUS_KIND_GROUP = 8;
    // An open repair.
    STATUS_KIND_REPAIR = 9;
    // A migration that waits for its cutover or its finish, or whose copy
    // fails.
    STATUS_KIND_MIGRATION = 10;
    // A clone being deleted or waiting for its source.
    STATUS_KIND_CLONE = 11;
    // A torn thin device.
    STATUS_KIND_TORN = 12;
    // A worker role with no registration, or a registration not refreshed
    // by the gateway's clock.
    STATUS_KIND_WORKER = 13;
    // The rows a pool's cap left out: how many, and where to read them.
    STATUS_KIND_MORE = 14;
}

// StatusRow is one thing the status read finds wrong (architecture.md,
// Clusters, GetClusterStatus). The id and name fields name the object for a
// script, each zero or empty where it does not apply; object says the same
// for people.
message StatusRow {
    // The pool the row belongs to, empty for a cluster row.
    string sp_name = 1;
    StatusKind kind = 2;
    string object = 3;
    // The status of the report row the row shows, RES_STATUS_UNKNOWN where
    // the read got no answer; absent where the row shows no report row.
    optional ResStatus status = 4;
    ResReason reason = 5;
    string text = 6;
    // How long the thing has been so, where a time records it; absent
    // otherwise.
    google.protobuf.Duration age = 7;
    uint64 cntlr_id = 8;
    uint64 slice_id = 9;
    uint64 grp_id = 10;
    uint64 leg_id = 11;
    uint64 side_id = 12;
    // The name of a thin device, a repair, a migration, a clone or a
    // transfer the row names, or a worker role.
    string obj_name = 13;
    // The node the row names or reaches.
    string addr_port = 14;
}

// GetClusterStatusReply is one page of the status read: the cluster rows on
// the first page, then each read pool's rows in key order.
message GetClusterStatusReply {
    string cluster_name = 1;
    repeated StatusRow row_list = 2;
    string page_token = 3;
    // The pools this page read.
    uint32 sp_cnt = 4;
    // The gateway's clock when the read began, which the ages of health
    // epochs and worker registrations are taken against.
    google.protobuf.Timestamp read_time = 5;
}

// ListWorkersRequest names nothing: the worker registry is cluster-independent
// (architecture.md, Key table), so the read takes no cluster_name.
message ListWorkersRequest {}

// RoleWorkers is one role's registrations as stored, keyed by the seed out of
// each WorkerReg key.
message RoleWorkers {
    map<string, WorkerReg> seed_to_reg = 1;
}

// ListWorkersReply carries every role of common.WorkerRole*, each present even
// when it has no registration, keyed by the role out of the key.
message ListWorkersReply {
    map<string, RoleWorkers> role_to_workers = 1;
}

