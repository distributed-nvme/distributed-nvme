message CreateRepairRequest {
    string cluster_name = 1;
    string sp_name = 2;
    SpRev sp_rev = 3;
    string rep_name = 4;
    uint64 grp_id = 5;
    repeated uint64 bad_leg_id_list = 6;
    // The retired leg of the group the new leg is taken from; zero: a fresh
    // leg, placed by dn_selector.
    uint64 retired_leg_id = 7;
    NodeSelector dn_selector = 8;
    // Let the primary copy over a leg of another md identity: the new leg
    // taken from retired_leg_id, and the bad legs once the repair is
    // aborted (Repair.force). Appended, never renumbered.
    bool force = 9;
    // Take a bad leg whose row the primary's latest report marks
    // RES_REASON_IDENTITY_UNDECIDED: the operator names it the stale copy
    // of the two identities. The Repair keeps nothing of it, so an abort
    // leaves the leg as it is (architecture.md, Repairs). Appended, never
    // renumbered.
    bool force_undecided = 10;
}

message CreateRepairReply {
    uint64 rep_id = 1;
    uint64 new_leg_id = 2;
}

message FinishRepairRequest {
    string cluster_name = 1;
    string sp_name = 2;
    SpRev sp_rev = 3;
    string rep_name = 4;
}

message FinishRepairReply {
    uint64 rep_id = 1;
    uint64 retired_leg_id = 2;
    // The group's oldest retired leg that is not kept, which the finish of
    // a worker's repair deleted so that the group stays within
    // MaxRetiredLegPerGrp, its side
    // given back to its disk node; zero when the finish gave none back.
    // Appended, never renumbered.
    uint64 given_back_leg_id = 3;
}

message CancelRepairRequest {
    string cluster_name = 1;
    string sp_name = 2;
    SpRev sp_rev = 3;
    string rep_name = 4;
}

message CancelRepairReply {
    uint64 rep_id = 1;
