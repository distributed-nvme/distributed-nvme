# dnv: the kernel module a host needs to reach dnv's volumes over NVMe/TCP,
# which systemd-modules-load loads at boot, and with it nvme-fabrics and
# nvme-core. Install as /etc/modules-load.d/dnv-host.conf on every host, and
# on every Kubernetes node that runs the CSI driver's node plugin, which
# refuses to start where the NVMe over Fabrics device is missing (csi.md
# CSI13).
nvme-tcp
