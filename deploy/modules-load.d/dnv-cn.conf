# dnv: the kernel modules a controller node's agent needs, which
# systemd-modules-load loads at boot. Install as
# /etc/modules-load.d/dnv-cn.conf on every machine that runs a cn agent; on
# a machine that also runs a dn agent, install dnv-dn.conf beside it. No
# agent loads a module itself. The two lists are the ones the node check
# reads for the cn role (dnv-agent check cn, its lines "kernel modules" and
# "kernel modules at boot"; dnagent.md CM5). A module built into the kernel
# needs no load.
#
# These must be loaded before the agent starts:
nvmet
nvme-fabrics
nvme-core
dm-mod
md-mod
# The kernel would load these when the agent first needs them, but loading
# them at boot shows a module the kernel lacks in the log of
# systemd-modules-load.service:
nvmet-tcp
nvme-tcp
dm-clone
dm-thin-pool
dm-flakey
raid1
