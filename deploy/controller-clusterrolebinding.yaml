# Gives the controller pod's account the cluster role (csi.md, Deployment).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dnv-csi-controller
subjects:
  - kind: ServiceAccount
    name: dnv-csi-controller
    namespace: dnv-csi
roleRef:
  kind: ClusterRole
  name: dnv-csi-controller
  apiGroup: rbac.authorization.k8s.io
