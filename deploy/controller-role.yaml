# The controller pod's rights within the driver's namespace (csi.md CSI19):
# the leases through which one provisioner and one attacher lead at a time,
# the capacity objects the leading provisioner owns, and the lookup of the
# pod's own owner, which every provisioner copy makes at its start.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dnv-csi-controller
  namespace: dnv-csi
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
