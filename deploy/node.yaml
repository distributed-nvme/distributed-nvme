# The node plugin (csi.md, Deployment): one pod per node, privileged and on
# the host's network, since the kernel keeps an NVMe/TCP connection in the
# network namespace of the process that made it. The kubelet's directories
# are mounted both ways so the mounts the plugin makes reach the host and the
# pods; the device and sysfs trees give it the volumes' devices and the
# controllers' state; the host's nvme directory gives it the node's identity,
# made empty where it is absent so that the plugin's own refusal names the
# missing files. The cdc addresses it follows come from the same config map
# as the controller's, read at the plugin's start. The registrar and the
# liveness probe run as root, the owner of the plugin's socket and of the
# kubelet's registration directory, with no capability and a read-only root;
# the probe answers on the loopback alone; no container talks to the API
# server, so the pod mounts no account token (CSI18).
#
# The kubelet's directory, /var/lib/kubelet, is the one value of this file
# an operator changes per distribution: it stands in the two mount paths and
# the registration path below and in four host paths, and one
# `sed 's|/var/lib/kubelet|<dir>|g'` changes them together.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dnv-csi-node
  namespace: dnv-csi
spec:
  selector:
    matchLabels:
      app: dnv-csi-node
  template:
    metadata:
      labels:
        app: dnv-csi-node
    spec:
      serviceAccountName: dnv-csi-node
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: dnv-csi
          image: dnv-csi:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - node
            - --csi-address=/csi/csi.sock
          env:
            - name: DNV_CSI_CDC_ADDRESSES
              valueFrom:
                configMapKeyRef:
                  name: dnv-csi-config
                  key: cdcAddresses
          securityContext:
            privileged: true
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 9809
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: pods-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: plugins-dir
              mountPath: /var/lib/kubelet/plugins
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: nvme-etc
              mountPath: /etc/nvme
              readOnly: true
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.dnv.io/csi.sock
            - --v=2
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=127.0.0.1:9809
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.dnv.io
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: DirectoryOrCreate
        - name: plugins-dir
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: nvme-etc
          hostPath:
            path: /etc/nvme
            type: DirectoryOrCreate
