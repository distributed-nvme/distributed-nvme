syntax = "proto3";

message AgentReply {
    uint32 code = 1;
    string details = 2;
}

message NodeSelector {
    repeated string black_list = 1;
    repeated string white_list = 2;
}

message NvmeTrConf {
    string tr_type = 1;
    string adr_fam = 2;
    string tr_addr = 3;
    string tr_svc_id = 4;
}

message QosRatio {
    bool strict = 1;
    uint64 bytes_per_iops = 2;
    uint64 bytes_per_bps = 3;
}

message DmCloneConf {
	uint32 hydration_threshold  = 1;
	uint32 hydration_batch_size = 2;
}

message DmPoolConf {
    uint64 data_block_size = 1;
    uint32 low_water_mark_pct = 2;
}

message RedundNone {}

message RedundMdRaid1 {
    // chunk_size_in_byte = bitmap_chunk_block_cnt * DmPoolConf.data_block_size
    uint64 bitmap_chunk_block_cnt = 1;
}

message RedundConf {
   oneof RedunKind {
       RedundNone redund_none = 1;
	   RedundMdRaid1 redund_md_raid1 = 2;
   }
}

// Just a placeholder
message BdevFeatureNone {}

message BdevFeature {
    oneof BdevFeatureKind {
	    BdevFeatureNone bdev_feature_none = 1;
	}
}

message DmRaid0Conf {
    uint64 stripe_size = 1;
}

message BdevConf {
    DmPoolConf dm_pool_conf = 1;
    DmRaid0Conf dm_raid0_conf = 2;
	RedundConf redund_conf = 3;
	repeated BdevFeature bdev_feature_list = 4;
}

message NodeState {
    uint64 set_epoch = 1;
    uint64 clear_epoch = 2;
}

message SidePointer {
    uint64 sp_id = 1;
    uint64 leg_id = 2;
    uint64 side_id = 3;
}

message CntlrPointer {
    uint64 sp_id = 1;
    uint64 cntlr_id = 2;
}

message Side {
    uint64 side_id = 1;
    string addr_port = 2;
	NvmeTrConf nvme_tr_conf = 3;
    uint32 cntlid_slot = 4;
}

message Leg {
    uint64 leg_id = 1;
    uint32 leg_idx = 2;
    repeated Side side_list = 3;
}

message Group {
    uint64 grp_id = 1;
    uint64 ext_cnt = 2;
    uint64 meta_blocks = 3;
    uint64 data_blocks = 4;
    repeated Leg leg_list = 5;
    repeated Leg spare_leg_list = 6;
}

message Namespace {
    uint64 ns_id = 1;
    uint32 ns_idx = 2;
    uint64 td_id = 3;
    uint64 ag_id = 4;
    string dev_uuid = 5;
    string dev_nguid = 6;
    bool suspended = 7;
}

enum SpLevel {
    // all dm/md devices are readable/writable
    SP_LEVEL_READWRITE = 0;
    // all thin device are readonly
    // all side are readonly
    // all hydration of clones/migrations are disabled
    SP_LEVEL_READONLY = 16;
    // Do not create all dm-clone for clones
    // and include all in SP_LEVEL_READONLY
    SP_LEVEL_NO_CLONE = 32;
    // Do not create thin pools
    // and include all in SP_LEVEL_NO_CLONE
    SP_LEVEL_NO_THINPOOL = 48;
    // Do not create raid 1/5/6
    // and include all in SP_LEVEL_NO_THINPOOL
    SP_LEVEL_NO_REDUND = 64;
    // Do not create dm-clone for migratoins
    // and include all in SP_LEVEL_NO_REDUND
    SP_LEVEL_NO_MIGRATION = 80;
    // Do not export sides
    // and include all in SP_LEVEL_NO_MIGRATION
    SP_LEVEL_NO_SIDE = 96;
    // Only create logical volumes
    // and nothing else
    SP_LEVEL_DISABLE = 112;
}

enum ResStatus {
    // UNKNOWN means can't get response from dn/cn
    RES_STATUS_UNKNOWN = 0;
    // MISSING means dn/cn doesn't create it
    RES_STATUS_MISSING = 1;
    // ERROR means dn/cn tried to create it but failed
    RES_STATUS_ERROR = 2;
    // EVENT means a dm or md event happens
    RES_STATUS_EVENT = 3;
    // OK means OK
    RES_STATUS_OK = 4;
}

message ResInfo {
    string res_name = 1;
    ResStatus status = 2;
    string details = 3;
    uint64 epoch = 4;
}

message LiveInfo {
    uint64 revision = 1;
    uint32 format = 2;
    repeated ResInfo res_info = 3;
}

message BitmapInfo {
    uint64 res_id = 1;
    repeated uint32 bm_idx_list = 2;
}

message DnBinConf {
    uint64 extent_size = 1;
    uint32 bin0_shift = 2;
    uint32 bin1_shift = 3;
    uint32 bin2_shift = 4;
    uint32 bin3_shift = 5;
}

message AllocConf {
    uint32 dn_batch_size = 1;
    uint32 cn_batch_size = 2;
}

enum FootprintType {
    FP_TYPE_SHA256 = 0;
    FP_TYPE_SHA512 = 1;
}

// {dnv_prefix} cluster_conf {cluster_name}
message ClusterConf {
    QosRatio qos_ratio = 1;
    BdevConf bdev_conf = 2;
    DnBinConf dn_bin_conf = 3;
    AllocConf alloc_conf = 4;
    FootprintType fp_type = 5;
}

// {dnv_prefix} dn_global {cluster_id}
message DnGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} cn_global {cluster_id}
message CnGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} sp_global {cluster_id}
message SpGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} dn_rev {shard_code} {cluster_id} {addr_port}
message DnRev {
    uint64 revision = 1;
}

// {dnv_prefix} cn_rev {shard_code} {cluster_id} {addr_port}
message CnRev {
    uint64 revision = 1;
}

// {dnv_prefix} sp_rev {shard_code} {cluster_id} {sp_name}
message SpRev {
    uint64 revision = 1;
}

// {dnv_prefix} dn_conf {cluster_id} {addr_port}
message DnConf {
    uint64 dn_id = 1;
    uint32 shard_code = 2;
    uint32 flags = 3;
    bytes state_fp = 4;
    NvmeTrConf nvme_tr_conf = 5;
    repeated SidePointer side_ptr_list = 6;
    uint64 total_ext_cnt = 7;
    uint64 free_ext_cnt = 8;
}

// {dnv_prefix} dn_note {cluster_id} {addr_port}
message DnNote {
    bytes note = 1;
}

// {dnv_prefix} cn_conf {cluster_id} {addr_port}
message CnConf {
    uint64 cn_id = 1;
    uint32 shard_code = 2;
    uint32 flags = 3;
    bytes state_fp = 4;
    NvmeTrConf nvme_tr_conf = 5;
    repeated CntlrPointer cntlr_ptr_list = 6;
    uint64 total_ext_cnt = 7;
    uint64 free_ext_cnt = 8;
}

// {dnv_prefix} cn_note {cluster_id} {addr_port}
message CnNote {
    bytes note = 1;
}

// {dnv_prefix} dn_capacity {cluster_id} {bin_idx} {free_ext_cnt} {addr_port}
message DnCapacity {
    string location = 1;
}

// {dnv_prefix} cn_capacity {cluster_id} {free_ext_cnt} {addr_port}
message CnCapacity {
    string location = 1;
}

// {dnv_prefix} cdc {cluster_id} {shard_code} {sp_id} {ss_id}
message CdcEntry {
    string nqn = 1;
    repeated NvmeTrConf nvme_tr_conf_list = 2;
    repeated string allowed_hosts = 3;
}

// {dnv_prefix} sp_conf {cluster_id} {sp_name}
message SpConf {
    uint64 sp_id = 1;
    uint32 shard_code = 2;
    uint64 next_id = 3;
    uint32 next_dev_id = 4;
    BdevConf bdev_conf = 5;
	repeated uint32 cntlid_slot_list = 7;
	SpLevel sp_level = 8;
    bytes state_fp = 9;
    bool deleting = 10;
    repeated uint64 cntlr_id_list = 11;
    repeated uint64 slice_id_list = 12;
    repeated string td_name_list = 13;
    repeated string nqn_list = 14;
    repeated string clone_name_list = 15;
    repeated string xfer_name_list = 16;
    repeated string migr_name_list = 17;
}

// {dnv_prefix} sp_conf {cluster_id} {sp_name}
message SpNote {
    bytes note = 1;
}

// {dnv_prefix} cntlr {cluster_id} {sp_id} {cntlr_id}
message Cntlr {
    string cn_addr_addr = 1;
	NvmeTrConf nvme_tr_conf = 2;
    uint32 cntlid_slot = 3;
    bool primary = 4;
	uint32 cntlr_idx = 5;
}

// {dnv_prefix} slice {cluster_id} {sp_id} {slice_id}
message Slice {
    uint32 slice_idx = 1;
    repeated Group meta_grp_list = 2;
    repeated Group data_grp_list = 3;
}

// {dnv_prefix} thin_device {cluster_id} {sp_id} {td_name}
message ThinDevice {
    uint64 td_id = 1;
    uint32 dev_id = 2;
    uint32 ori_id = 3;
    uint64 size = 4;
}

// {dnv_prefix} subsystem {cluster_id} {sp_id} {nqn}
message Subsystem {
    uint64 ss_id = 1;
    string serial = 2;
    string model = 3;
    repeated Namespace ns_list = 4;
    repeated string allowed_hosts = 5;
}

// {dnv_prefix} clone {cluster_id} {sp_id} {clone_name}
message Clone {
    uint64 clone_id = 1;
    repeated NvmeTrConf src_tr_conf_list = 2;
    string src_nqn = 3;
    uint32 src_ns_idx = 4;
    uint32 src_slice_cnt = 5;
    uint64 src_stripe_size = 6;
    uint64 src_block_size = 7;
    uint64 dst_td_id = 8;
    DmCloneConf dm_clone_conf = 9;
    bool auto_resume = 10;
    uint32 bm_cnt = 11;
}

// {dnv_prefix} clone_bitmap {cluster_id} {sp_id} {clone_name} {bm_idx}
message CloneBitmap {
    bytes bitmap = 1;
}

// {dnv_prefix} transfer {cluster_id} {sp_id} {xfer_name}
message Transfer {
    uint64 xfer_id = 1;
    string ori_nqn = 2;
    uint32 ori_ns_idx = 3;
    repeated string allowed_hosts = 4;
    bool auto_suspend = 5;
}

// {dnv_prefix} migration {cluster_id} {sp_id} {migr_name}
message Migration {
    uint64 migr_id = 1;
    uint64 src_side_id = 2;
    uint64 dst_side_id = 3;
    DmCloneConf dm_clone_conf = 4;
    uint32 bm_cnt = 5;
}

// {dnv_prefix} migration_bitmap {cluster_id} {sp_id} {migr_name} {bm_idx}
message MigrBitmap {
    bytes bitmap = 1;
}

// {dnv_prefix} sp_id_to_name {cluster_id} {sp_id}
message SpName {
    string sp_name = 1;
}

