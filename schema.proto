syntax = "proto3";

message NvmeTrConf {
    string tr_type = 1;
    string adr_fam = 2;
    string tr_addr = 3;
    string tr_svc_id = 4;
}

message QosRatio {
    int64 bytes_per_iops = 1;
    int64 bytes_per_bps = 2;
}

message SpLdId {
    uint64 sp_id = 1;
    uint64 ld_id = 2;
}

message SpCntlrId {
    uint64 sp_id = 1;
    uint64 cntlr_id = 2;
}

enum RedunType {
    REDUN_TYPE_NONE = 0;
    REDUN_TYPE_RAID1 = 1;
    REDUN_TYPE_RAID5_LS = 2;
    REDUN_TYPE_RAID6_ZR = 3;
}

message SpConf {
    repeated string features = 1;
    RedunType redun_type = 2;
}

message Group {
    uint64 grp_id = 1;
    repeated uint64 ld_id_list = 2;
}

enum AnaType {
    ANA_TYPE_AUTO = 0;
    ANA_TYPE_OPTIMIZED = 1;
    ANA_TYPE_UNACCESSIBLE = 2;
}

message Namespace {
    uint64 ns_id = 1;
    uint32 ns_idx = 2;
    uint64 td_id = 3;
    bool suspended = 4;
    AnaType ana_type = 5;
}

enum ResStatus {
    RES_STATUS_MISSING = 0;
    RES_STATUS_ERROR = 1;
    RES_STATUS_OK = 2;
    
}
message ResInfo {
    string res_name = 1;
    ResStatus status = 2;
    string details = 3;
    uint64 epoch = 4;
}

message NodeResInfo {
    uint64 node_id = 1;
    uint64 revision = 2;
    repeated ResInfo res_info_list = 3;
}

// {dnv_prefix} cluster_conf {cluster_name}
message ClusterConf {
    QosRatio qos_ratio = 1;
}

// {dnv_prefix} cluster_desc {cluster_id}
message ClusterDesc {
    bytes description = 1;
}

// {dnv_prefix} dn_global {cluster_id}
message DnGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} cn_global {cluster_id}
message CnGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} sp_global {cluster_id} 
message SpGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} dn_rev {cluster_id} {shard_code} {addr_port}
message DnRev {
    uint64 revision = 1;
}

// {dnv_prefix} cn_rev {cluster_id} {shard_code} {addr_port}
message CnRev {
    uint64 revision = 1;
}

// {dnv_prefix} sp_rev {cluster_id} {shard_code} {sp_name}
message SpRev {
    uint64 revision = 1;
}

// {dnv_prefix} disk_node {cluster_id} {addr_port}
message DiskNode {
    uint64 dn_id = 1;
    uint32 shard_code = 2;
    bool enabled = 3;
    bool healthy = 4;
    NvmeTrConf nvme_tr_conf = 5;
    repeated SpLdId sp_ld_id_list = 6;
    uint32 segment_cnt = 7;
}

// {dnv_prefix} dn_desc {cluster_id} {dn_id}
message DnDesc {
    bytes description = 1;
}

// {dnv_prefix} segment {cluster_id} {dn_id} {segment_idx}
message DnSegment {
    uint64 start = 1;
    uint64 ext_cnt = 2;
    bytes bitmap = 3;
}

// {dnv_prefix} controller_node {cluster_id} {addr_port}
message ControllerNode {
    uint64 cn_id = 1;
    uint32 shard_code = 2;
    bool enabled = 3;
    bool healthy = 4;
    NvmeTrConf nvme_tr_conf = 5;
    repeated SpCntlrId sp_cntlr_id_list = 6;
    uint64 max_size = 7;
}

// {dnv_prefix} cn_desc {cluster_id} {cn_id}
message CnDesc {
    bytes description = 1;
}

// {dnv_prefix} dn_capacity {cluster_id} {bin_idx} {free_space} {addr_port} {segment_idx}
message DnCapacity {
    string location = 1;
}

// {dnv_prefix} cn_capacity {cluster_id} {free_space} {addr_port}
message CnCapacity {
    string location = 1;
}

// {dnv_prefix} cdc {cluster_id} {shard_code} {sp_id} {ss_id}
message CdcEntry {
    string nqn = 1;
    repeated NvmeTrConf nvme_tr_conf_list = 2;
    repeated string allowed_hosts = 3;
}

// {dnv_prefix} storage_pool {cluster_id} {sp_name}
message StoragePool {
    uint64 sp_id = 1;
    uint32 shard_code = 2;
    uint64 next_id = 3;
    uint32 next_dev_id = 4;
    SpConf sp_conf = 5;
    repeated uint64 cntlr_id_list = 6;
    repeated uint64 leg_id_list = 7;
    repeated uint64 ld_id_list = 8;
    repeated string td_name_list = 9;
    repeated string nqn_list = 10;
    repeated string clone_name_list = 11;
    repeated string move_name_list = 12;
}

// {dnv_prefix} cntlr {cluster_id} {sp_id} {cntlr_id}
message Cntlr {
    string cn_addr_addr = 1;
    uint32 cntlr_idx = 2;
    bool enabled = 3;
}

// {dnv_prefix} leg {cluster_id} {sp_id} {leg_id}
message Leg {
    repeated Group meta_grp_list = 1;
    repeated Group data_grp_list = 2;
}

// {dnv_prefix} logical_disk {cluster_id} {sp_id} {ld_id}
message LogicalDisk {
    string dn_addr_port = 1;
}

// {dnv_prefix} ld_for_cn {cluster_id} {sp_id} {ld_id}
message LdForCn {
    NvmeTrConf nvme_tr_conf = 1;
    uint64 size = 2;
}

// {dnv_prefix} ld_to_dn {cluster_id} {sp_id} {ld_id}
message LdForDn {
    uint32 segment_idx = 1;
    bytes bitmap = 2;
}

// {dnv_prefix} thin_device {cluster_id} {sp_id} {td_name}
message ThinDevice {
    uint64 td_id = 1;
    uint32 dev_id = 2;
    uint32 ori_id = 3;
    uint64 size = 4;
}

// {dnv_prefix} subsystem {cluster_id} {sp_id} {nqn}
message Subsystem {
    uint64 ss_id = 1;
    repeated Namespace ns_list = 2;
    repeated string allowed_hosts = 3;
}

// {dnv_prefix} clone {cluster_id} {sp_id} {clone_name}
message Clone {
    uint64 clone_id = 1;
    uint64 meta_ld_id = 2;
    NvmeTrConf src_tr_conf = 3;
    uint64 dst_td_id = 4;
    uint32 factor = 5;
    bytes bitmap = 6;
}

// {dnv_prefix} move {cluster_id} {sp_id} {move_name}
message Move {
    uint64 move_id = 1;
    uint64 meta_ld_id = 2;
    uint64 src_ld_id = 3;
    uint64 dst_ld_id = 4;
}

// {dnv_prefix} sp_id_to_name {cluster_id} {sp_id}
message SpName {
    string sp_name = 1;
}

