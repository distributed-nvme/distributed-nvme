syntax = "proto3";

message AgentReply {
    uint32 code = 1;
    string details = 2;
}

message NvmeTrConf {
    string tr_type = 1;
    string adr_fam = 2;
    string tr_addr = 3;
    string tr_svc_id = 4;
}

// 0 means no limit
// positive means apply the limit to the thin pool of each slice
// negative means apply to both thin pools and legs
message QosRatio {
    int64 bytes_per_iops = 1;
    int64 bytes_per_bps = 2;
}

message DmPoolConf {
    uint64 data_block_size = 1;
    bool error_if_no_space = 2;
    uint32 low_water_mark_pct = 3;
}

message DmRaid0Conf {
    uint64 stripe_size = 1;
}

message DmRaid1Conf {
    uint64 region_size = 1;
}

message BdevConf {
    DmPoolConf dm_pool_conf = 1;
    DmRaid0Conf dm_raid0_conf = 2;
    DmRaid1Conf dm_raid1_conf = 3;
}

message SidePointer {
    uint64 sp_id = 1;
    uint64 leg_id = 2;
    uint64 side_id = 3;
}

message CntlrPointer {
    uint64 sp_id = 1;
    uint64 cntlr_id = 2;
}

enum RedunType {
    REDUN_TYPE_NONE = 0;
    REDUN_TYPE_DM_RAID1 = 1;
}

enum RedunState {
    REDUN_STATE_INSYNC = 0;
    REDUN_STATE_SYNCINGI = 1;
    REDUN_STATE_FAILED = 2;
}

enum RedunOpKind {
    REDUN_OP_KIND_CREATE = 0;
    REDUN_OP_KIND_READD = 1;
}

message RedunOp {
    RedunOpKind op_kind = 1;
    uint64 target_leg_id = 2;
    uint64 authoritative_leg_id_list = 3;
}

message Side {
    uint64 side_id = 1;
    string addr_port = 2;
    uint32 nvme_id_set = 3;
}

message Leg {
    uint64 leg_id = 1;
    uint32 leg_idx = 2;
    repeated Side side_list = 3;
    RedunState redun_state = 4;
}

message Group {
    uint64 grp_id = 1;
    uint64 ext_cnt = 2;
    repeated Leg leg_list = 3;
    repeated Leg spare_leg_list = 4;
    // survivor_list stores leg_id
    repeated uint64 survivor_list = 5;
    RedunOp redun_op = 6;
}

message Namespace {
    uint64 ns_id = 1;
    uint32 ns_idx = 2;
    uint64 td_id = 3;
    string dev_uuid = 4;
    string dev_nguid = 5;
}

enum ResStatus {
    // UNKNOWN means can't get response from dn/cn
    RES_STATUS_UNKNOWN = 0;
    // MISSING means dn/cn doesn't create it
    RES_STATUS_MISSING = 1;
    // ERROR means dn/cn tried to create it but failed
    RES_STATUS_ERROR = 2;
    // OK means OK
    RES_STATUS_OK = 3;
}

message ResInfo {
    string res_name = 1;
    ResStatus status = 2;
    string details = 3;
    uint64 epoch = 4;
}

message LiveInfo {
    uint64 revision = 1;
    uint32 format = 2;
    repeated ResInfo res_info = 3;
}

message DnBinConf {
    uint64 extent_size = 1;
    uint32 bin0_shift = 2;
    uint32 bin1_shift = 3;
    uint32 bin2_shift = 4;
    uint32 bin3_shift = 5;
}

message AllocConf {
    uint32 dn_batch_size = 1;
    uint32 cn_batch_size = 2;
}

// {dnv_prefix} cluster_conf {cluster_name}
message ClusterConf {
    QosRatio qos_ratio = 1;
    BdevConf bdev_conf = 2;
    DnBinConf dn_bin_conf = 3;
    AllocConf alloc_conf = 4;
}

// {dnv_prefix} cluster_desc {cluster_id}
message ClusterDesc {
    bytes description = 1;
}

// {dnv_prefix} dn_global {cluster_id}
message DnGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} cn_global {cluster_id}
message CnGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} sp_global {cluster_id} 
message SpGlobal {
    uint64 next_id = 1;
    repeated uint32 shard_bucket = 2;
}

// {dnv_prefix} dn_rev {cluster_id} {shard_code} {addr_port}
message DnRev {
    uint64 revision = 1;
}

// {dnv_prefix} cn_rev {cluster_id} {shard_code} {addr_port}
message CnRev {
    uint64 revision = 1;
}

// {dnv_prefix} sp_rev {cluster_id} {shard_code} {sp_name}
message SpRev {
    uint64 revision = 1;
}

// {dnv_prefix} dn_conf {cluster_id} {addr_port}
message DnConf {
    uint64 dn_id = 1;
    uint32 shard_code = 2;
    bool enabled = 3;
    bool healthy = 4;
    NvmeTrConf nvme_tr_conf = 5;
    repeated SidePointer side_ptr_list = 6;
    uint64 total_ext_cnt = 7;
    uint64 free_ext_cnt = 8;
}

// {dnv_prefix} dn_desc {cluster_id} {dn_id}
message DnDesc {
    bytes description = 1;
}

// {dnv_prefix} cn_conf {cluster_id} {addr_port}
message CnConf {
    uint64 cn_id = 1;
    uint32 shard_code = 2;
    bool enabled = 3;
    bool healthy = 4;
    NvmeTrConf nvme_tr_conf = 5;
    repeated CntlrPointer cntlr_ptr_list = 6;
    uint64 total_ext_cnt = 7;
    uint64 free_ext_cnt = 8;
}

// {dnv_prefix} cn_desc {cluster_id} {cn_id}
message CnDesc {
    bytes description = 1;
}

// {dnv_prefix} dn_capacity {cluster_id} {bin_idx} {free_space} {addr_port} {segment_idx}
message DnCapacity {
    string location = 1;
}

// {dnv_prefix} cn_capacity {cluster_id} {free_space} {addr_port}
message CnCapacity {
    string location = 1;
}

// {dnv_prefix} cdc {cluster_id} {shard_code} {sp_id} {ss_id}
message CdcEntry {
    string nqn = 1;
    repeated NvmeTrConf nvme_tr_conf_list = 2;
    repeated string allowed_hosts = 3;
}

// {dnv_prefix} sp_conf {cluster_id} {sp_name}
message SpConf {
    uint64 sp_id = 1;
    uint32 shard_code = 2;
    uint64 next_id = 3;
    uint32 next_dev_id = 4;
    repeated string features = 5;
    RedunType redun_type = 6;
    BdevConf bdev_conf = 7;
    bool deleting = 8;
    repeated uint64 cntlr_id_list = 9;
    repeated uint64 slice_id_list = 10;
    repeated string td_name_list = 11;
    repeated string nqn_list = 12;
    repeated string clone_name_list = 13;
    repeated string xfer_name_list = 14;
    repeated string migr_name_list = 15;
}

// {dnv_prefix} sp_desc {cluster_id} {sp_id}
message SpDesc {
    bytes description = 1;
}

// {dnv_prefix} cntlr {cluster_id} {sp_id} {cntlr_id}
message Cntlr {
    string cn_addr_addr = 1;
    uint32 nvme_id_set = 2;
    bool primary = 3;
}

// {dnv_prefix} slice {cluster_id} {sp_id} {slice_id}
message Slice {
    uint32 slice_idx = 1;
    repeated Group meta_grp_list = 2;
    repeated Group data_grp_list = 3;
}

// {dnv_prefix} thin_device {cluster_id} {sp_id} {td_name}
message ThinDevice {
    uint64 td_id = 1;
    uint32 dev_id = 2;
    uint32 ori_id = 3;
    uint64 size = 4;
}

// {dnv_prefix} subsystem {cluster_id} {sp_id} {nqn}
message Subsystem {
    uint64 ss_id = 1;
    string serial = 2;
    string model = 3;
    repeated Namespace ns_list = 4;
    repeated string allowed_hosts = 5;
}

// {dnv_prefix} clone {cluster_id} {sp_id} {clone_name}
message Clone {
    uint64 clone_id = 1;
    repeated NvmeTrConf src_tr_conf_list = 2;
    string src_nqn = 3;
    uint32 src_ns_idx = 4;
    uint64 dst_td_id = 5;
    uint64 region_size = 6;
    bytes bitmap = 7;
    uint64 total_cnt = 8;
    uint64 curr_cnt = 9;
}

// {dnv_prefix} transfer {cluster_id} {sp_id} {xfer_name}
message Transfer {
    uint64 xfer_id = 1;
    string ori_nqn = 2;
    uint32 ori_ns_idx = 3;
}

// {dnv_prefix} migration {cluster_id} {sp_id} {migr_name}
message Migration {
    uint64 migr_id = 1;
    uint64 src_side_id = 2;
    uint64 dst_side_id = 3;
    uint64 region_size = 4;
    bytes bitmap = 5;
    uint64 total_cnt = 6;
    uint64 curr_cnt = 7;
}

// {dnv_prefix} sp_id_to_name {cluster_id} {sp_id}
message SpName {
    string sp_name = 1;
}

message CreateClusterRequest {
    string cluster_name = 1;
    bytes description = 2;
    QosRatio qos_ratio = 3;
    BdevConf bdev_conf = 4;
    DnBinConf dn_bin_conf = 5;
    AllocConf alloc_conf = 6;
}

message CreateClusterReply {
    uint64 cluster_id = 1;
}

message DeleteClusterRequest {
    string cluster_name = 1;
}

message DeleteClusterReply {
