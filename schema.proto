message GetDnSizeRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
}

message GetDnSizeReply {
    uint64 size = 1;
}

message SyncupDnRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    uint64 revision = 3;
    bool partial = 4;
    repeated SidePointer side_pointer_list = 5;
}

message SyncupDnReply {
    AgentReply agent_reply = 1;
    LiveInfo live_info = 2;
}

message SyncupSideRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    SidePointer side_poiner = 3;
    uint64 revision = 4;
    uint64 ext_cnt = 5;
    repeated uint64 cn_id_list = 6;
    Side src_side = 7;
}

message SyncupSideReply {
    AgentReply agent_reply = 1;
    LiveInfo live_info = 2;
}

message GetDnInfoRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
}

message GetDnInfoReply {
    AgentReply agent_reply = 1;
    LiveInfo live_info = 2;
}

message GetSideInfoRequest {
    uint64 cluster_id = 1;
    uint64 dn_id = 2;
    SidePointer side_pointer = 3;
}

message GetSideInfoReply {
    AgentReply agent_reply = 1;
    LiveInfo live_info = 2;
}

message FenceRequest {
    uint64 cluster_id = 1;
    uint64 sp_id = 2;
    uint64 ld_id = 3;
    uint64 cn_id = 4;
    uint64 revision = 5;
}

message FenceReply {
    bool succeed = 1;
}

service DiskNodeAgent {
    rpc GetDnSize(GetDnSizeRequest) returns(GetDnSizeReply) {}
    rpc SyncupDn(stream SyncupDnRequest) returns(stream SyncupDnReply) {}
    rpc SyncupSide(stream SyncupSideRequest) returns(stream SyncupSideReply) {}
    rpc GetDnInfo(GetDnInfoRequest) returns(GetDnInfoReply) {}
    rpc GetSpLdInfo(GetSideInfoRequest) returns(GetSideInfoReply) {}
    rpc Fence(FenceRequest) returns(FenceReply) {}
}

message GetCnSizeRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
}

message GetCnSizeReply {
    uint64 size = 1;
}

message SyncupCnRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    uint64 revision = 3;
    repeated CntlrPointer cntlr_pointer_list = 4;
    QosRatio qos_ratio = 5;
}

message SyncupCnReply {
    AgentReply agent_reply =  1;
    LiveInfo live_info = 2;
}

message SyncupCntlrRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    uint64 sp_id = 3;
    uint64 cntlr_id = 4;
    uint64 revision = 5;
    repeated string features = 6;
    RedunType redun_type = 7;
    BdevConf bdev_conf = 8;
    uint32 cntlr_idx = 9;
    repeated uint64 slice_id_list = 10;
    repeated Slice slice_list = 11;
    repeated ThinDevice td_list = 12;
    repeated string nqn_list = 13;
    repeated Subsystem ss_list = 14;
    repeated Clone clone_list = 15;
    repeated Transfer xfer_list = 16;
    repeated Migration migr_list = 17;
}

message SyncupCntlrReply {
    AgentReply agent_reply = 1;
    LiveInfo live_info = 2;
}

message GetCnInfoRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
}

message GetCnInfoReply {
    AgentReply agent_reply = 1;
    LiveInfo live_info = 2;
}

message GetCntlrInfoRequest {
    uint64 cluster_id = 1;
    uint64 cn_id = 2;
    uint64 sp_id = 3;
    uint64 cntlr_id = 4;
}

message GetCntlrInfoReply {
    AgentReply agent_reply = 1;
    LiveInfo live_info = 2;
}

service ControllerNodeAgent {
    rpc GetCnSize(GetCnSizeRequest) returns(GetCnSizeReply) {}
    rpc SyncupCn(stream SyncupCnRequest) returns(stream SyncupCnReply) {}
    rpc SyncupCntlr(stream SyncupCntlrRequest) returns(stream SyncupCntlrReply) {}
    rpc GetCnInfo(GetCnInfoRequest) returns(GetCnInfoReply) {}
    rpc GetCntlrInfo(GetCntlrInfoRequest) returns(GetCntlrInfoReply) {}
}