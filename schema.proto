service Gateway {
    rpc CreateCluster(CreateClusterRequest) returns(CreateClusterReply) {}
    rpc DeleteCluster(DeleteClusterRequest) returns(DeleteClusterReply) {}
    rpc GetCluster(GetClusterRequest) returns(GetClusterReply) {}
    rpc ListClusters(ListClustersRequest) returns(ListClustersReply) {}
    rpc UpdateClusterDesc(UpdateClusterDescRequest) returns(UpdateClusterDescReply) {}

    rpc CreateDiskNode(CreateDiskNodeRequest) returns(CreateDiskNodeReply) {}
    rpc DeleteDiskNode(DeleteDiskNodeRequest) returns(DeleteDiskNodeReply) {}
    rpc GetDiskNode(GetDiskNodeRequest) returns(GetDiskNodeReply) {}
    rpc ListDiskNodes(ListDiskNodesRequest) returns(ListDiskNodesReply) {}
    rpc UpdateDiskNodeDesc(UpdateDiskNodeDescRequest) returns(UpdateDiskNodeDescReply) {}
    rpc UpdateDiskNodeEnabled(UpdateDiskNodeEnabledRequest) returns(UpdateDiskNodeEnabledReply) {}
    rpc InspectDiskNode(InspectDiskNodeRequest) returns(InspectDiskNodeReply) {}

    rpc CreateControllerNode(CreateControllerNodeRequest) returns(CreateControllerNodeReply) {}
    rpc DeleteControllerNode(DeleteControllerNodeRequest) returns(DeleteControllerNodeReply) {}
    rpc GetControllerNode(GetControllerNodeRequest) returns(GetControllerNodeReply) {}
    rpc ListControllerNodes(ListControllerNodesRequest) returns(ListControllerNodesReply) {}
    rpc UpdateControllerNodeDesc(UpdateControllerNodeDescRequest) returns(UpdateControllerNodeDescReply) {}
    rpc UpdateControllerNodeEnabled(UpdateControllerNodeEnabledRequest) returns(UpdateControllerNodeEnabledReply) {}
    rpc InspectControllerNode(InspectControllerNodeRequest) returns(InspectControllerNodeReply) {}

    rpc CreateStoragePool(CreateStoragePoolRequest) returns(CreateStoragePoolReply) {}
    rpc DeleteStoragePool(DeleteStoragePoolRequest) returns(DeleteStoragePoolReply) {}
    rpc GetStoragePool(GetStoragePoolRequest) returns(GetStoragePoolReply) {}
    rpc ListStoragePools(ListStoragePoolsRequest) returns(ListStoragePoolsReply) {}
    rpc UpdateStoragePoolDesc(UpdateStoragePoolDescRequest) returns(UpdateStoragePoolDescReply) {}
    rpc InspectStoragePool(InspectStoragePoolRequest) returns(InspectStoragePoolReply) {}
    rpc GrowStoragePool(GrowStoragePoolRequest) returns(GrowStoragePoolReply) {}
    rpc FindStoragePoolName(FindStoragePoolNameRequest) returns(FindStoragePoolNameReply) {}

    rpc CreateCntlr(CreateCntlrRequest) returns(CreateCntlrReply) {}
    rpc DeleteCntlr(DeleteCntlrRequest) returns(DeleteCntlrReply) {}
    rpc UpdateCntlrEnabled(UpdateCntlrEnabledRequest) returns(UpdateCntlrEnabledReply) {}

    rpc CreateThinDevice(CreateThinDeviceRequest) returns(CreateThinDeviceReply) {}
    rpc DeleteThinDevice(DeleteThinDeviceRequest) returns(DeleteThinDeviceReply) {}
    rpc ListThinDevices(ListThinDevicesRequest) returns(ListThinDevicesReply) {}

    rpc CreateSubsystem(CreateSubsystemRequest) returns(CreateSubsystemReply) {}
    rpc DeleteSubsystem(DeleteSubsystemRequest) returns(DeleteSubsystemReply) {}
    rpc ListSubsystems(ListSubsystemsRequest) returns(ListSubsystemsReply) {}

    rpc CreateNamespace(CreateNamespaceRequest) returns(CreateNamespaceReply) {}
    rpc DeleteNamespace(DeleteNamespaceRequest) returns(DeleteNamespaceReply) {}
    rpc UpdateNamespaceSuspended(UpdateNamespaceSuspendedRequest) returns(UpdateNamespaceSuspendedReply) {}
    rpc UpdateNamespaceAna(UpdateNamespaceAnaRequest) returns(UpdateNamespaceAnaReply) {}

    rpc CreateHost(CreateHostRequest) returns(CreateHostReply) {}
    rpc DeleteHost(DeleteHostRequest) returns(DeleteHostReply) {}

    rpc CreateClone(CreateCloneRequest) returns(CreateCloneReply) {}
    rpc DeleteClone(DeleteCloneRequest) returns(DeleteCloneReply) {}
    rpc ListClones(ListClonesRequest) returns(ListClonesReply) {}

    rpc CreateMove(CreateMoveRequest) returns(CreateMoveReply) {}
    rpc FinishMove(FinishMoveRequest) returns(FinishMoveReply) {}
    rpc CancelMove(CancelMoveRequest) returns(CancelMoveReply) {}
    rpc ListMoves(ListMovesRequest) returns(ListMovesReply) {}
}

