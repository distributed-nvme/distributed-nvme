# The runs of integtest/runner.sh, one after another in this order
# (layout.md, Directory tree).
#
# One run per line: a name, the suite's script (from the repository root,
# or an absolute path), then the suite's arguments. Words are split at
# blanks, and a quote is a character like any other: there is no quoting.
# An argument that holds a blank, which only a backslash before it can give
# it, is refused. A line that ends with a backslash goes on on the next line.
# Blank lines are skipped, and so is a comment line, one whose first
# character other than a blank is #, wherever it is: inside a run that goes
# on over several lines, the run goes on past a comment line that itself
# ends with a backslash and ends at one that does not, so a run is commented
# out line by line. A name is one plain word; the run's output files carry
# it. --cleanup-only and --wipe are refused: the runner adds --cleanup-only
# itself after a failed run.
#
# The guests: control plane 192.168.122.78; controller nodes .125, .229,
# .77; disk nodes .48, .70, .49, .122; hosts .193, .197.

dn      integtest/dnagent_test.sh yupeng@192.168.122.48 yupeng@192.168.122.70
cn      integtest/cnagent_test.sh yupeng@192.168.122.125 yupeng@192.168.122.229
worker  integtest/worker_test.sh  yupeng@192.168.122.78
gateway integtest/gateway_test.sh yupeng@192.168.122.78
dnvctl  integtest/dnvctl_test.sh  yupeng@192.168.122.78
cdc     integtest/cdc_test.sh     yupeng@192.168.122.78 yupeng@192.168.122.125 \
        yupeng@192.168.122.193 yupeng@192.168.122.197

e2e-1   integtest/e2e_test.sh --slice-cnt 1 \
        --cp yupeng@192.168.122.78 \
        --cn yupeng@192.168.122.125 --cn yupeng@192.168.122.229 --cn yupeng@192.168.122.77 \
        --dn yupeng@192.168.122.48 --dn yupeng@192.168.122.70 \
        --dn yupeng@192.168.122.49 --dn yupeng@192.168.122.122 \
        --host yupeng@192.168.122.193 --host yupeng@192.168.122.197
e2e-4   integtest/e2e_test.sh --slice-cnt 4 \
        --cp yupeng@192.168.122.78 \
        --cn yupeng@192.168.122.125 --cn yupeng@192.168.122.229 --cn yupeng@192.168.122.77 \
        --dn yupeng@192.168.122.48 --dn yupeng@192.168.122.70 \
        --dn yupeng@192.168.122.49 --dn yupeng@192.168.122.122 \
        --host yupeng@192.168.122.193 --host yupeng@192.168.122.197
e2e-32  integtest/e2e_test.sh --slice-cnt 32 \
        --cp yupeng@192.168.122.78 \
        --cn yupeng@192.168.122.125 --cn yupeng@192.168.122.229 --cn yupeng@192.168.122.77 \
        --dn yupeng@192.168.122.48 --dn yupeng@192.168.122.70 \
        --dn yupeng@192.168.122.49 --dn yupeng@192.168.122.122 \
        --host yupeng@192.168.122.193 --host yupeng@192.168.122.197

# The Kubernetes suite takes every guest, like the e2e runs, and comes last:
# k3s stays on .78, .193 and .197 between runs (csi.md CSI1).
csi     integtest/csi_test.sh \
        --cp yupeng@192.168.122.78 \
        --cn yupeng@192.168.122.125 --cn yupeng@192.168.122.229 --cn yupeng@192.168.122.77 \
        --dn yupeng@192.168.122.48 --dn yupeng@192.168.122.70 \
        --dn yupeng@192.168.122.49 --dn yupeng@192.168.122.122 \
        --host yupeng@192.168.122.193 --host yupeng@192.168.122.197
